    title: Государство и общество
    relatedArticles: []
    body: |
      ## Государство и общество

      ### Британская Империя [К]

      Общее название политической системы, находящейся под верховной властью британской Короны.

      Империя состоит из территорий с различным уровнем автономии. Прямое управление из Лондона применяется только к части владений.

      В обычной речи чаще используется просто **Империя**.

      ---

      ### Корона [К]

      Монарх как источник верховной государственной власти и совокупность институтов, действующих от его имени.

      Фраза «служить Короне» может относиться как к военной службе, так и к государственной администрации.

      ---

      ### Земли Короны [К]

      Территории под непосредственным управлением Имперского правительства.

      Обладают меньшей автономией, чем Доминионы.

      **Англ.: Crown Territories / Crown Lands.**

      ---

      ### Доминион Короны [К]

      Крупная автономная территория внутри Империи.

      Доминион обладает собственным правительством и внутренним законодательством. Вопросы внешней политики остаются за Короной.

      В разговорной речи обычно используется просто **Доминион**.

      ---

      ### Имперский протекторат [К]

      Государство, сохранившее собственную администрацию и значительную часть внутренних законов, но признавшее британское верховенство.

      Протекторат формально может сохранять собственного монарха.

      ---

      ### Зависимая Корона [Р]

      Монархия, чей правящий дом сохранился после присоединения к Имперской системе.

      Местный монарх приносит присягу британскому монарху и управляет территорией от его имени.

      Такое устройство характерно для некоторых европейских государств.

      ---

      ### Имперское пэрство [Р]

      Совокупность титулованной аристократии Империи.

      Включает старые британские семьи и новые династии, получившие титулы за службу Короне.

      ---

      ### Имперская служба [Р]

      Общее обозначение государственной карьеры внутри Империи.

      Используется для чиновников и офицеров.

      Фраза:

      > «Сорок лет Имперской службы.»
