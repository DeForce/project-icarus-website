    title: Экзотическая физика
    relatedArticles: []
    body: |
      ## Экзотическая физика

      ### Экзофаза [К]

      Общее научное название вещества, находящегося в необычном устойчивом или метастабильном состоянии.

      Первые экзофазы были обнаружены в Антарктике в 1970 году.

      В ранних документах часто ошибочно называются **экзотическими элементами**.

      Разговорное сокращение: **экзотика**.

      ---

      ### Галлеит [К]

      Первая практически применимая экзофаза.

      Представляет собой сложную кристаллическую структуру. При подаче энергии испускает короткоживущие заряженные частицы.

      **Англ.: Halleyite.**

      Предположительное происхождение названия: антарктический комплекс Галлей.

      ---

      ### Галлион [К]

      Аномальная заряженная частица, образующаяся при возбуждении Галлеита.

      Галлионы существуют вне кристаллической структуры короткое время.

      Их движение можно контролировать электромагнитным полем.

      **Англ.: Hallion.**

      ---

      ### Галлионный поток [Р]

      Управляемый поток галлионов.

      Может быть сфокусирован для создания оружия либо распределён внутри защитного поля.

      В инженерной речи: **поток**.

      ---

      ### Кельвий [К]

      Энергетическая экзофаза.

      Относительно стабилен при обычной температуре. В условиях глубокого вакуума и сильного охлаждения начинается активный распад с выделением большого количества энергии.

      **Англ.: Kelvium.**

      ---

      ### Активный Кельвий [Р]

      Кельвий, переведённый в состояние ускоренного распада.

      Фраза «ядро активно» означает, что реактор находится в рабочем режиме.

      ---

      ### Кеплерит [К]

      Лунная экзофаза, впервые обнаруженная в районе кратера Кеплер.

      Кислород нарушает её метастабильное состояние и вызывает чрезвычайно мощное выделение энергии.

      **Англ.: Keplerite.**

      ---

      ### Кельвиевый синтез [К]

      Промышленный процесс получения Кельвия из Кеплерита при помощи галлионного потока.

      Процесс требует высокой точности и большого расхода энергии.
