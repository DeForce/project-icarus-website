  - key: ref-lexicon
    category: reference-works
    title: Флотский словарь
    relatedArticles: []
    body: |
      ## Флотский словарь

      ## Общий принцип

      Имперский космический флот исторически вырос из Королевского флота. Поэтому большая часть привычной морской терминологии сохранилась.

      Кораблём по-прежнему **командуют**, а не «управляют платформой».

      На нём есть капитан, вахта, машинное отделение и артиллерийские расчёты.

      Слова, связанные с переходной технологией, появились позднее и постепенно встроились в старую систему.

      Флотская речь обычно короче официальной. Если инженер говорит «оболочка», в документации будет написано «переходная оболочка».

      ---

      ## Общие корабельные термины

      ### Мостик

      Центральный командный пост корабля.

      На небольших судах совмещает навигацию и связь.

      На военных кораблях мостик может находиться глубоко внутри корпуса, поэтому название давно перестало означать помещение с обзорными окнами.

      ---

      ### Машинное отделение

      Помещения энергетической установки, двигателей и вспомогательных систем.

      Переходный реактор может иметь собственный изолированный отсек.

      ---

      ### Переходная

      Отсек переходного реактора и его управляющих систем.

      Официальное название обычно длиннее, но экипажи почти всегда используют именно это слово.

      > «Инженер нужен в переходной.»

      ---

      ## Вахта и служба

      ### Вахта

      Период корабельной службы.

      Термин сохранился без изменений.

      > «Кто сегодня держит вторую вахту?»

      ---

      ## Боевая терминология

      ### Луч

      Обычное название галлионного лучевого оружия.

      > «Луч заряжен.»

      ---

      ### Пакет

      Группа ракет, запущенных почти одновременно.

      > «Входящий пакет, шесть целей.»

      ---

      ### Заглушить

      Нарушить работу сенсоров или связи противника.

      ---

      ## Считатели

      ### Считатель

      Во флоте слово обычно используется без дополнительных пояснений.

      На крупном корабле может быть несколько специализированных Считателей.

      ---

      ## Навигация

      ### Решение

      Полный расчёт перехода.

      Включает положение корабля и параметры оболочки.

      Без готового решения переход запрещён.

      ---

      ### Линия

      Регулярный маршрут между системами.

      Может обслуживаться государством или частным перевозчиком.

      ---

      ## Связь

      ### Курьерский пакет

      Физический носитель важных данных.

      Обычно имеет собственное шифрование и защиту от вскрытия.

      ---

      ### Почта

      Любой набор данных, перевозимый между системами.

      Даже секретный пакет Адмиралтейства экипаж может назвать почтой.

      > «После заправки забираем почту на Марс.»
