    body: |
      ## Энергетика

      ### Кельвиевый реактор [К]

      Энергетическая установка, использующая контролируемый распад Кельвия.

      Реакция регулируется охлаждением.

      Повышение температуры снижает активность Кельвия.

      ---

      ### Реакторное ядро [Р]

      Рабочая камера кельвиевого реактора вместе с активной загрузкой.

      В речи инженеров часто просто **ядро**.

      ---

      ### Охладить ядро [Р]

      Запустить или увеличить активность кельвиевого реактора.

      Для человека старой энергетической школы выражение звучит парадоксально: реактор увеличивает мощность при снижении температуры.

      ---

      ### Заглушить ядро [Р]

      Вывести Кельвий из активного режима.

      Обычно достигается повышением температуры либо изменением среды реакторной камеры.
  - key: ref-glossary-computing
    category: reference-works
    title: Вычислительная техника
    relatedArticles: []
    body: |
      ## Вычислительная техника

      ### Считатель [К]

      Биологическая вычислительная система.

      Сложные модели используют живую человеческую нервную ткань. На крупных установках применяется поддерживаемый в рабочем состоянии человеческий мозг.

      Считатель особенно эффективен при работе с плохо формализуемыми динамическими системами.

      **Англ.: Reckoner.**

      ---

      ### Машинный вычислитель [Р]

      Обычная электронная или электромеханическая вычислительная система.

      Лучше Считателя выполняет точную арифметику.

      В сложных системах машинный вычислитель обычно работает вместе со Считателем.

      ---

      ### Оператор Считателя [Р]

      Специалист, отвечающий за взаимодействие экипажа со Считателем.

      Контролирует состояние биологической системы и формулирует вычислительные задачи.

      ---

      ### Вычислительный офицер [Р]

      Флотская должность.

      Отвечает за Считателя, сложные расчёты и работу с корабельными информационными системами.

      Функционально занимает место «хакера» в экипаже.
  - key: ref-glossary-weapons
    category: reference-works
    title: Оружие и защита
    relatedArticles: []
    body: |
      ## Оружие и защита

      ### Галлеонный луч [К]

      Сфокусированный поток галлионов, используемый как оружие.

      Разговорное название: **луч**.

      Термин «лазер» считается технически неправильным, хотя может встречаться в старой популярной литературе.

      ---

      ### Лучевое орудие [Р]

      Обычное название корабельного оружия на основе галлионного потока.

      На флоте конкретные установки называют **лучевыми батареями** или просто **батареями**.

      ---

      ### Полевой экран [К]

      Защитное поле на основе распределённого потока галлионов.

      Эффективно взаимодействует с кинетическими объектами и заряженными частицами.

      Лучевое оружие быстро расходует энергетический резерв экрана.

      Разговорное название: **щит**.

      ---

      ### Экранная установка [Р]

      Комплекс генераторов и Галлеитовых элементов, создающий полевой экран.

      ---

      ### Экранный резерв [Р]

      Количество энергии, которое система способна передать полю до перегрева либо отключения.

      В боевой речи:

      > «Щит на сорока процентах.»

      ---

      ### Кинетическое оружие [К]

      Оружие, наносящее повреждение физическим снарядом.

      Продолжает широко использоваться на поверхности планет и против целей без полевого экрана.

      ---

      ### Тактическая ракета [Р]

      Управляемый боеприпас, используемый прежде всего как носитель специального оборудования.

      Может нести устройство помех или компактную лучевую установку.

      Чисто кинетические ракеты значительно менее эффективны против защищённых кораблей.
  - key: ref-glossary-transition
    category: reference-works
    title: Физика Перехода
    relatedArticles: []
    body: |
      ## Физика Перехода

      ### Переход Вейна—Эшдаун [К]

      Физический эффект, позволяющий переместить ограниченную область пространства.

      Назван по двум исследовательским программам, взаимодействие которых вызвало Юпитерианский инцидент.

      Официальное сокращение: **ПВЭ / VAE Transition**.

      ---

      ### Поле Вейна [К]

      Разреженное галлионное поле большого объёма.

      Первоначально создавалось как экспериментальный защитный экран.

      Стало основой метрического якоря.

      ---

      ### Реактор Эшдаун [К]

      Экспериментальный импульсный кельвиевый реактор.

      Позднейшие переходные реакторы используют разработанные в этой программе принципы пульсации.

      ---

      ### Переход [К]

      Контролируемое перемещение переходной оболочки.

      Основной технический термин.

      В разговорной речи используется **прыжок**.

      ---

      ### Прыжок [К]

      Разговорное и флотское обозначение Перехода.

      Фразы:

      > «Готовиться к прыжку.»

      > «До следующего прыжка два часа.»

      ---

      ### Переходный реактор [К]

      Корабельная установка, создающая последовательность импульсов, необходимую для Перехода.

      Не является якорем.

      ---

      ### Пульсатор [Р]

      Флотское или инженерное название переходной части реакторного комплекса.

      Используется как бытовое сокращение:

      > «Пульсатор опять сбивает фазу.»

      ---

      ### Метрический якорь [К]

      Стационарная установка, создающая устойчивую пространственную конфигурацию для контролируемого Перехода.

      Разговорное название: **якорь**.

      Полноценный якорь нельзя безопасно размещать внутри действующего переходного корабля.

      ---

      ### Якорная станция [Р]

      Космический объект, основная функция которого состоит в обслуживании метрического якоря.

      Крупные станции также имеют ремонтные доки и склады.

      ---

      ### Переходная оболочка [К]

      Замкнутая область пространства, которая переносится во время Перехода.

      Всё, что полностью попадает внутрь оболочки, совершает Переход вместе с кораблём.

      Разговорные варианты:

      **оболочка**, **поле**.

      Слово **пузырь** — неформальный жаргон механиков.

      ---

      ### Переходный объём [Р]

      Объём пространства внутри переходной оболочки.

      Одна из основных величин при расчёте энергозатрат.

      ---

      ### Порядок перехода [К]

      Класс устойчивого режима пульсации переходного реактора.

      Более высокий порядок обеспечивает большую дальность и требует резкого увеличения мощности.

      Флотская форма:

      > «Корабль способен держать четвёртый порядок.»

      ---

      ### Якорный переход [Р]

      Переход, выполняемый с использованием известной якорной инфраструктуры.

      Считается стандартным способом перемещения.

      ---

      ### Свободный переход [К]

      Переход в область, где отсутствует принимающий метрический якорь.

      Требует значительно более сложного навигационного расчёта.

      Первый межзвёздный полёт проекта «Икар» относится именно к этому типу.

      ---

      ### Гравитационный предел [Р]

      Уровень локального гравитационного воздействия, выше которого Переход заданного порядка становится нестабильным.

      У каждого порядка собственные требования.

      ---

      ### Переходная зона [Р]

      Область вокруг массивного объекта, в которой допускается работа якорей определённого класса.

      ---

      ### Абсолютная система отсчёта перехода [К]

      Система отсчёта, связанная с фундаментальной структурой пространства, с которой взаимодействуют экзофазы.

      Определяет причинную последовательность переходных событий.

      Научное сокращение: **АСОП**.

      ---

      ### Мировая линия [Р]

      В навигации Перехода — расчётное движение астрономического объекта через пространство и время.

      Межзвёздный корабль целится не в неподвижную координату, а в рассчитанное положение нужной звезды на её мировой линии.
  - key: ref-glossary-infrastructure
    category: reference-works
    title: Космическая инфраструктура
    relatedArticles: []
    body: |
      ## Космическая инфраструктура

      ### Ближний якорь [Р]

      Якорная станция относительно близко к планете.

      Используется для местного транспорта и переходов низких порядков.

      ---

      ### Дальний якорь [Р]

      Станция в области более слабого гравитационного воздействия.

      Используется для дальних маршрутов.

      ---

      ### Внешний якорь [Р]

      Якорь, расположенный на дальней границе транспортной инфраструктуры системы.

      Перед стартом «Икара» именно такой комплекс служил последней точкой Имперской сети.

      ---

      ### Переходная сеть [Р]

      Совокупность метрических якорей и регулярных маршрутов между ними.

      Разговорно: **сеть**.

      ---

      ### Переходный маршрут [Р]

      Регулярно используемая последовательность якорей.

      Маршрут включает обычный полёт между планетой и её переходной инфраструктурой.

      ---

      ### Орбитальная верфь [К]

      Промышленный комплекс для строительства и капитального ремонта космических кораблей.
  - key: ref-glossary-comms
    category: reference-works
    title: Связь
    relatedArticles: []
    body: |
      ## Связь

      ### Световая связь [Р]

      Любая связь посредством обычного электромагнитного излучения.

      Радио относится к этой категории.

      Скорость ограничена скоростью света.

      ---

      ### Курьерская связь [Р]

      Передача информации посредством физического носителя на переходном корабле.

      На больших расстояниях значительно быстрее радиосвязи.

      ---

      ### Курьерский пакет [Р]

      Защищённый физический носитель с официальными данными.

      Может содержать дипломатическую корреспонденцию или военные распоряжения.

      ---

      ### Имперский курьер [Р]

      Корабль высокой переходной дальности, предназначенный для быстрой доставки информации.

      Обычно имеет небольшой переходный объём и непропорционально мощный реактор.
  - key: ref-glossary-shipclasses
    category: reference-works
    title: Классы кораблей
    relatedArticles: []
    body: |
      ## Классы кораблей

      ### Переходный курьер [Р]

      Небольшой корабль с высокой дальностью Перехода.

      Значительную часть его конструкции занимает энергетическая установка.

      ---

      ### Переходный буксир [К]

      Корабль, способный расширить собственную оболочку и переносить внешний груз.

      Может использоваться для транспортировки другого корабля.

      ---

      ### Транспорт / грузовик [Р]

      Крупный корабль с большим переходным объёмом.

      Несмотря на мощный реактор, обычно имеет меньшую дальность, чем курьер.

      ---

      ### Танкер [Р]

      Крупный транспорт для перевозки расходных материалов и реакторных компонентов.

      Высокая масса ограничивает дальность Перехода.

      ---

      ### Эскорт [К]

      Военный корабль, предназначенный для сопровождения транспортов.

      Военный корабль проекта «Икар» относится к этому классу.

      ---

      ### Переходный носитель [Р]

      Тяжёлый корабль, способный захватить своей оболочкой несколько меньших судов.

      Может использоваться для переброски флота на большие расстояния.

      Термин пока остаётся рабочим: устоявшееся британское название ещё не закреплено.
  - key: ref-glossary-ranks
    category: reference-works
    title: Флотские должности
    relatedArticles: []
    body: |
      ## Флотские должности

      ### Командир корабля [Р]

      Офицер, несущий общую ответственность за корабль.

      Для крупного судна обычно имеет звание капитана.

      ---

      ### Пилот [Р]

      Отвечает за обычное управление кораблём.

      ---

      ### Навигационный офицер [Р]

      Отвечает за астрономическую навигацию и расчёт Перехода.

      На небольших судах функции пилота и навигатора могут совмещаться.

      ---

      ### Артиллерийский офицер [Р]

      Отвечает за лучевое вооружение и боеприпасы.

      Также координирует работу полевого экрана в бою.

      ---

      ### Главный инженер [Р]

      Отвечает за энергетическую установку и переходный реактор.

      ---

      ### Вычислительный офицер [Р]

      Работает со Считателем и корабельными вычислительными системами.

      Отвечает за обработку данных и защищённую связь.
  - key: ref-glossary-periods
    category: reference-works
    title: Исторические периоды и события
    relatedArticles: []
    body: |
      ## Исторические периоды и события

      ### Американское урегулирование [К]

      Комплекс политических решений 1774–1783 годов, позволивший Британии сохранить североамериканские колонии.

      Позднее стал основой системы Доминионов.

      ---

      ### Империя компромисса [К]

      Историографическое название периода после Американского урегулирования.

      Характеризуется постепенным включением колониальных элит в британскую систему власти.

      ---

      ### Первая Китайская война [К]

      Официальное Имперское название конфликта 1839–1842 годов.

      За пределами Империи используется название **Опиумная война**.

      ---

      ### Век Имперского расширения [К]

      Период второй половины XIX века, когда британская система распространилась на большую часть Земли.

      ---

      ### Долгий Имперский век [К]

      Период относительной политической стабильности в первой половине XX века.

      ---

      ### Антарктическое открытие [К]

      Обнаружение первых экзофаз в 1970 году.

      ---

      ### Кельвиевая эпоха [К]

      Период, начавшийся после практического освоения кельвиевой энергетики.

      ---

      ### Марсианский исход [К]

      Переселение группы независимых государств и политических эмигрантов на Марс.

      Событие положило начало постоянному политическому соперничеству в космосе.

      ---

      ### Солнечная экспансия [К]

      Начальный период масштабного заселения Солнечной системы.

      ---

      ### Солнечный век [К]

      Период зрелой колонизации Солнечной системы перед открытием Перехода.

      ---

      ### Юпитерианский инцидент [К]

      Авария 2041 года, в ходе которой исследовательская станция совершила первый случайный Переход.

      Разговорный исторический вариант: **Юпитерский разрыв**.

      ---

      ### IDS-17 «Фарадей» [К]

      Имперский автоматический аппарат дальней разведки.

      Первым обнаружил сигнал пропавшей после Юпитерианского инцидента станции. После передачи первых данных связь с аппаратом прекратилась.

      Полное обозначение:

      **Imperial Deep-Space Surveyor 17, Faraday.**

      ---

      ### Эра Перехода [К]

      Период после появления надёжной переходной инфраструктуры.

      Характеризуется тем, что физический транспорт стал способен опережать электромагнитную связь.

      ---

      ### Проект ICARUS [К]

      Первая программа межзвёздного Перехода.

      Проект предусматривает отправку экспедиционного транспорта и военного эскорта к другой звезде.

      Транспорт должен построить первый внесолнечный метрический якорь.

      ---

      ### Межзвёздная эпоха [Р]

      Название исторического периода, который должен начаться после успешного завершения проекта «Икар».

      К моменту запуска экспедиции термин ещё используется скорее как публицистический.
  - key: ref-glossary-daily
    category: reference-works
    title: Полезный бытовой словарь
    relatedArticles: []
    body: |
      ## Полезный бытовой словарь

      Официальная речь и разговорная речь заметно различаются:

      **Метрический якорь** → якорь  
      **Переход Вейна—Эшдаун** → переход  
      **Контролируемый переход** → прыжок  
      **Переходная оболочка** → оболочка / пузырь  
      **Галлионное лучевое орудие** → луч  
      **Полевой экран** → щит  
      **Переходный реактор** → реактор / пульсатор  
      **Кельвиевое реакторное ядро** → ядро  
      **Экзофазы** → экзотика  
      **Вычислительная биологическая система** → Считатель

      Главное правило терминологии мира: официальная речь остаётся технической и консервативной, тогда как экипажи сокращают почти любое длинное название.
