    body: |
      ## Считатели

      #### Развитие технологии и её применение к 2061 году

      ### Предпосылки появления Считателей

      В первой половине XX века развитие вычислительной техники столкнулось с серьёзными технологическими ограничениями.

      Несмотря на совершенствование электронной промышленности, производство компактных полупроводниковых элементов оставалось дорогостоящим. Дальнейшее уменьшение размеров кремниевых компонентов сопровождалось ростом числа производственных дефектов и снижением надёжности.

      Электронные вычислительные машины продолжали увеличивать производительность, однако требовали значительных производственных мощностей.

      Для решения сложных математических задач применялись ламповые и электромеханические вычислители. Широкое распространение получили аналоговые системы, предназначенные для моделирования физических процессов.

      В промышленности использовались специализированные машины, способные выполнять большое количество точных операций.

      При этом создание компактных вычислителей для распознавания сложных закономерностей оставалось технически затруднительным.

      Особенно серьёзные проблемы возникали при обработке неполной информации и построении моделей процессов с большим количеством взаимосвязанных параметров.

      В таких обстоятельствах исследовательские учреждения обратили внимание на возможности живой нервной ткани.

      Работы в области нейрофизиологии постепенно привели к появлению биологических вычислительных систем, получивших название **Считателей**.

      ---

      ### Принципы биологических вычислений

      В отличие от обычных электронных вычислителей, мозг использует распределённую сеть взаимосвязанных нервных клеток.

      Человеческий мозг содержит около 86 миллиардов нейронов. Каждый из них способен образовывать многочисленные связи с другими клетками.

      Передача сигналов между нейронами происходит сравнительно медленно.

      Даже простые электронные вычислительные устройства способны выполнять арифметические операции значительно быстрее человеческого мозга.

      Однако нервная система обладает высокой степенью параллельной обработки информации.

      Большое количество нейронных сетей одновременно обрабатывает различные сигналы.

      Важной особенностью мозга является способность изменять структуру связей под влиянием опыта.

      Это свойство, известное как **нейропластичность**, позволяет нервной системе постепенно приспосабливаться к новым условиям.

      Во время обучения меняются свойства синаптических соединений и характер взаимодействия между группами нейронов.

      В результате мозг способен осваивать сложные закономерности без необходимости заранее описывать их исчерпывающим набором математических правил.

      Именно это свойство стало основой технологии Считателей.

      #### Разделение вычислительных задач

      Обычные вычислительные машины сохраняют преимущества в точной арифметике и хранении формализованных данных.

      Они применяются для обработки числовых таблиц, решения уравнений и исполнения заданных последовательностей операций.

      Биологические вычислители используются для анализа сложных сигналов, распознавания состояний и построения адаптивных моделей.

      Считатель может обучаться распознавать закономерности в больших потоках взаимосвязанных измерений.

      В подобных задачах его нейронная архитектура позволяет уменьшить объём последовательных вычислений, необходимых для получения практически полезного результата.

      Это преимущество не означает большей скорости отдельных операций.

      Эффективность достигается благодаря параллельной работе нервных сетей и накопленному в их структуре опыту.

      ---

      ### Биологическая память

      Одной из особенностей человеческого мозга является высокая плотность хранения информации.

      Оценки потенциальной информационной ёмкости его синаптических соединений достигают петабайтного диапазона.

      Однако подобные оценки не означают, что мозг способен хранить соответствующее количество точных цифровых записей.

      Человеческая память имеет распределённый характер.

      Воспоминания связаны с состояниями многочисленных нейронных сетей и могут изменяться в процессе воспроизведения.

      Поэтому биологические вычислители не рассматриваются как непосредственная замена обычных устройств хранения данных.

      Их преимущество заключается в возможности сохранять приобретённые закономерности в структуре самой вычислительной сети.

      Подготовленный Считатель может распознавать сложные ситуации на основании ранее усвоенного опыта.

      При этом результаты его работы нуждаются в проверке обычными вычислительными средствами.

      Для хранения точных исходных данных используются отдельные электронные и электромеханические устройства.

      ---

      ### Создание биологического вычислителя

      Развитие Считателей стало возможным после появления методов продолжительного поддержания человеческого мозга вне организма.

      Исследования в области медицинской перфузии позволили создать установки, обеспечивавшие нервную ткань кислородом и необходимыми питательными веществами.

      Такие системы требовали постоянного контроля температуры и состава циркулирующей среды.

      Дальнейшие работы были направлены на создание интерфейсов между живой нервной тканью и электронной аппаратурой.

      В ходе исследований было установлено, что определённые нейронные сети способны постепенно приспосабливаться к искусственным входным сигналам.

      Мозг мог обучаться распознавать последовательности электрической активности, передаваемые специализированными интерфейсами.

      Позднее появились методы преобразования отдельных областей коры для выполнения вычислительных функций.

      Эта процедура получила название **кортикальной перепривязки** (_Cortical Reassignment_).

      Она стала основным технологическим принципом наиболее сложных человеческих Считателей.

      ---

      ### Кортикальная перепривязка

      Кортикальная перепривязка представляет собой комплекс медицинских и нейротехнических процедур, предназначенных для изменения функций отдельных нейронных сетей.

      В обычном человеческом организме значительная часть нервной системы участвует в обработке ощущений и управлении телом.

      После преобразования человека в Считателя некоторые из этих функций утрачивают прежнее назначение.

      Нейронные структуры, ранее участвовавшие в обработке зрительных и других сенсорных сигналов, постепенно приспосабливаются к работе с искусственными источниками информации.

      Для этого используются многоканальные нейроинтерфейсы.

      Интерфейс передаёт в нервную ткань согласованные последовательности электрических сигналов.

      Одновременно оборудование регистрирует активность нейронных сетей.

      Полученные данные используются для изменения параметров взаимодействия между мозгом и вычислительной аппаратурой.

      Процесс перепривязки осуществляется постепенно.

      Отдельные участки коры сохраняют способность выполнять прежние функции, тогда как другие осваивают новые способы обработки информации.

      Полная перестройка мозга не требуется.

      Более того, чрезмерное повреждение существующих нейронных связей снижает общую эффективность вычислителя.

      Поэтому успешное преобразование зависит от сохранения значительной части исходной нервной архитектуры.

      #### Функциональная специализация

      В результате перепривязки некоторые нейронные сети приобретают способность обрабатывать сигналы, существенно отличающиеся от естественных человеческих ощущений.

      Например, структуры, ранее участвовавшие в пространственном восприятии, могут обучаться анализировать взаимное положение объектов по данным корабельных приборов.

      Другие области приспосабливаются к распознаванию характерных изменений в потоках технических измерений.

      При этом возможности преобразования различаются у разных людей.

      Индивидуальные особенности нервной системы влияют на скорость обучения и итоговую специализацию Считателя.

      ---

      ### Обучение после преобразования

      Завершение хирургических процедур ещё не означает готовности Считателя к работе.

      После подключения нейроинтерфейсов начинается продолжительная подготовка.

      Первоначально система передаёт простые сигналы, соответствующие заранее известным состояниям.

      По мере адаптации мозга сложность задач увеличивается.

      Нейронные сети постепенно обучаются различать характерные сочетания входных данных.

      В дальнейшем Считатель начинает работать с моделями реальных технических процессов.

      Подготовка наиболее сложных систем может занимать месяцы или годы.

      В течение этого времени специалисты оценивают устойчивость полученных навыков и точность обработки информации.

      У каждого Считателя формируется индивидуальная специализация.

      Некоторые лучше справляются с пространственными задачами.

      Другие демонстрируют высокие результаты при анализе сложных временных зависимостей.

      Способности к обучению также различаются.

      Поэтому подготовленные Считатели не являются полностью взаимозаменяемыми.

      Перенос одного Считателя на другую вычислительную задачу может потребовать продолжительного дополнительного обучения.

      ---

      ### Добровольные Считатели

      Первоначально преобразование человеческого мозга проводилось на добровольной основе.

      Среди первых участников подобных программ значительную часть составляли пациенты с заболеваниями, не поддававшимися обычному лечению.

      Для таких людей процедура представляла возможность продолжения жизни в изменённом состоянии.

      Другие добровольцы соглашались на преобразование по личным причинам.

      Отдельные программы предусматривали выплаты семьям добровольцев и последующее обеспечение самого Считателя.

      Поскольку процедура является необратимой, её проведение требует оформленного согласия.

      #### Сохранение личности

      Добровольные Считатели в значительной степени сохраняют память и индивидуальные особенности личности.

      После преобразования они способны узнавать знакомых людей и вспоминать события прежней жизни.

      При наличии соответствующего интерфейса Считатель может общаться с окружающими.

      Качество общения зависит от состояния нервной системы и конструкции вычислительного комплекса.

      В наиболее сложных установках возможен полноценный речевой обмен.

      Другие системы используют ограниченные формы текстовой или сигнальной коммуникации.

      Однако сохранение личности не означает неизменности мышления.

      Преобразование сопровождается существенным изменением сенсорного опыта.

      После утраты тела человек постепенно приспосабливается к восприятию окружающего мира через искусственные интерфейсы.

      Продолжительная работа с техническими данными влияет на способы организации внимания и памяти.

      В результате Считатель со временем может воспринимать события иначе, чем обычный человек.

      ---

      ### Изменение сознания при продолжительной службе

      На ранних этапах после преобразования большинство добровольных Считателей сохраняет привычные формы мышления.

      Они продолжают использовать воспоминания и представления, сформировавшиеся до процедуры.

      Однако дальнейшая работа приводит к постепенной адаптации нервных сетей.

      По мере обучения всё больше привычных вычислительных задач становится частью непосредственного восприятия Считателя.

      Например, опытный корабельный Считатель может воспринимать положение судна и состояние его систем как единую пространственную структуру.

      Поступающие измерения образуют для него устойчивую картину происходящего.

      При этом восприятие больше не ограничивается теми способами организации информации, которые характерны для обычного человеческого зрения и слуха.

      Со временем подобные изменения могут затрагивать повседневное мышление.

      Некоторые Считатели начинают уделять меньше внимания привычным бытовым событиям.

      У других меняется ощущение продолжительности времени или характер воспоминаний.

      Степень таких изменений зависит от личности и особенностей службы.

      #### Сохранение индивидуальности

      Постепенное изменение мышления не обязательно сопровождается утратой личности.

      Считатель может сохранять привязанность к родственникам и прежние убеждения.

      Многие продолжают воспринимать собственную биографию как непрерывную историю.

      При этом их новые способы обработки информации со временем становятся всё менее похожими на обычное человеческое мышление.

      Поэтому состояние добровольного Считателя рассматривается как продолжительное развитие личности в изменённой сенсорной среде.

      В медицинской практике особое внимание уделяется сохранению возможностей общения с людьми.

      Продолжительная социальная изоляция способна отрицательно влиять на психологическое состояние и устойчивость работы вычислительной системы.

      ---

      ### Искусственная сенсорная среда

      Для поддержания нормальной деятельности добровольного Считателя необходима управляемая система сенсорного взаимодействия.

      После преобразования мозг лишается большинства естественных сигналов, поступавших от тела.

      Полная сенсорная изоляция способна приводить к серьёзным нарушениям психического состояния.

      Поэтому вычислительные комплексы оснащаются устройствами искусственной сенсорной стимуляции.

      Они позволяют передавать информацию, соответствующую зрительным и слуховым ощущениям.

      В наиболее сложных системах Считатель способен воспринимать искусственно сформированное окружающее пространство.

      Такая среда может использоваться для общения с обслуживающим персоналом и периодов отдыха.

      При этом её работа обеспечивается обычной электронной аппаратурой и нейроинтерфейсами.

      Качество искусственного восприятия зависит от технических возможностей установки.

      Системы, предназначенные для сложного анализа, могут предоставлять Считателю дополнительные специализированные каналы информации.

      Таким образом, техническое состояние вычислителя непосредственно влияет на характер восприятия окружающего мира его биологическим компонентом.

      ---

      ### Каторжные Считатели

      Развитие технологии привело к её применению в государственной системе уголовных наказаний.

      Для отдельных осуждённых к пожизненному заключению была введена процедура принудительного преобразования в биологический вычислитель.

      Такие установки получили название **каторжных Считателей**.

      В отличие от добровольного преобразования, процедура включает дополнительное необратимое нейрохирургическое вмешательство.

      Его целью является подавление способности осуждённого к самостоятельной личностной деятельности.

      В обиходе операция получила название лоботомии.

      Используемая процедура отличается от ранних медицинских методов лоботомии и разработана с учётом необходимости сохранения вычислительных функций нервной ткани.

      При преобразовании сохраняются нейронные структуры, пригодные для выполнения специализированных задач.

      #### Вычислительные ограничения

      Подавление самостоятельной личностной деятельности сопровождается нарушением взаимодействия между некоторыми нервными сетями.

      В результате каторжные Считатели обычно уступают добровольным в задачах, требующих сложной адаптации.

      Их чаще используют для ограниченного набора вычислительных функций.

      Такие системы могут обучаться распознаванию заданных состояний и обработке повторяющихся потоков информации.

      Однако возможности самостоятельного изменения вычислительной стратегии существенно ограничены.

      Поэтому каторжные Считатели преимущественно применяются в стационарных промышленных комплексах.

      Они также могут входить в состав крупных специализированных вычислительных установок.

      Умышленное подавление личности делает их менее подходящими для задач, предполагающих постоянное взаимодействие с человеком.

      #### Правовая и медицинская проблема

      Официально каторжный Считатель рассматривается как осуждённый, отбывающий установленное судом наказание.

      При этом его тело подвергается необратимому преобразованию, а оставшаяся нервная ткань используется для вычислительной работы.

      Вопрос о сохранении субъективных переживаний после подобной процедуры остаётся предметом научных и нравственных споров.

      Отсутствие речевой коммуникации само по себе не позволяет достоверно установить отсутствие сознания.

      Эта неопределённость является одним из основных аргументов противников вычислительной каторги.

      К 2061 году подобные наказания сохраняются в имперском законодательстве, несмотря на продолжающиеся общественные разногласия.

      ---

      ### Вычислительный комплекс Считателя

      Человеческий мозг имеет сравнительно небольшие физические размеры.

      Однако полноценный Считатель представляет собой крупную медицинскую и вычислительную установку.

      Центральным компонентом комплекса является герметичная камера поддержания нервной ткани.

      Она соединяется с системой искусственного кровоснабжения и обмена веществ.

      Отдельные устройства обеспечивают контроль температуры и химического состава циркулирующей среды.

      Система медицинского наблюдения постоянно регистрирует состояние биологического компонента.

      Нейроинтерфейсы связывают мозг с вычислительной аппаратурой.

      В состав комплекса входят усилители и преобразователи сигналов.

      Для обработки данных применяются специализированные электронные устройства.

      Наиболее сложные установки могут занимать отдельные помещения.

      В корабельных системах медицинская камера размещается в защищённом отсеке.

      Рядом располагаются управляющие шкафы и аппаратура Ferranti.

      Конструкция предусматривает резервное питание жизненно важных компонентов.

      Повреждение системы жизнеобеспечения может привести к необратимому разрушению нервной ткани.

      Поэтому при проектировании военных кораблей вычислительные комплексы Считателей рассматриваются как критически важное оборудование.

      ---

      ### Физиологические ограничения

      Несмотря на изменения, Считатель остаётся живой биологической системой.

      Его работа зависит от постоянного обеспечения нервной ткани кислородом и питательными веществами.

      Нарушение кровоснабжения приводит к быстрому ухудшению состояния мозга.

      Температура должна поддерживаться в узком допустимом диапазоне.

      Продолжительные перегрузки нейронных сетей могут сопровождаться снижением точности обработки информации.

      Особое значение имеют циклы сна и восстановления.

      Добровольные Считатели сохраняют потребность в периодическом изменении режима нервной активности.

      Работа без достаточного восстановления снижает способность к обучению и повышает вероятность ошибок.

      Также сохраняются процессы биологического старения.

      Медицинские методы способны замедлять отдельные изменения нервной ткани, однако не обеспечивают её неограниченного срока службы.

      Фактическая продолжительность существования Считателя зависит от исходного состояния мозга и качества медицинского обслуживания.

      Надёжность комплекса определяется одновременно техническим состоянием аппаратуры и здоровьем биологического компонента.

      ---

      ### Искусственно выращенные нейронные системы

      Параллельно с преобразованием человеческого мозга развивались исследования искусственно выращенной нервной ткани.

      Подобные культуры используются в экспериментальных вычислительных устройствах.

      Некоторые из них успешно выполняют ограниченные задачи распознавания сигналов.

      Однако создание сложной архитектуры, сопоставимой со зрелым человеческим мозгом, остаётся чрезвычайно трудным.

      Формирование естественной нервной системы занимает продолжительное время и сопровождается последовательным развитием многочисленных взаимосвязанных структур.

      Искусственно выращенные культуры обычно обладают менее сложной организацией.

      Их вычислительные возможности ограничиваются сравнительно узким набором задач.

      Поэтому они находят применение преимущественно в специализированных промышленных устройствах.

      Для сложной адаптивной обработки информации продолжают использовать подготовленные человеческие Считатели.

      Использование зрелого мозга позволяет опираться на уже сформированную биологическую архитектуру.

      При этом последующая перепривязка требует значительно меньшего объёма структурного вмешательства, чем попытка искусственно воспроизвести всю нервную систему.

      ---

      ### Считатели и обычные вычислительные машины

      К середине XXI века сложилась практика совместного использования биологических и электронных вычислителей.

      Электронная аппаратура выполняет точные арифметические операции.

      Аналоговые вычислители применяются для моделирования физических процессов.

      Считатели обрабатывают сложные сигналы и выявляют закономерности, для распознавания которых обычной автоматике требуются значительно более громоздкие системы.

      Результаты биологических вычислений передаются в электронный комплекс.

      Он обеспечивает их дальнейшую математическую обработку и проверку.

      Такое разделение позволяет учитывать особенности каждого типа вычислительной техники.

      Считатели не заменяют обычные компьютеры.

      Они являются специализированной частью сложных вычислительных комплексов.

      Их применение остаётся оправданным прежде всего там, где требуются высокая адаптивность и обработка многочисленных взаимосвязанных сигналов.

      ---

      ### Использование в промышленности

      Первые промышленные Считатели применялись для наблюдения за сложными производственными процессами.

      Биологические вычислители обучались распознавать признаки нестабильности оборудования.

      Особое значение имела работа с системами, состояние которых зависело от большого количества взаимосвязанных параметров.

      Считатели могут выявлять характерные сочетания измерений, предшествующие возникновению аварийных ситуаций.

      При этом непосредственное управление быстрыми технологическими процессами обычно осуществляется электронными регуляторами.

      Считатель выполняет функции анализа и прогнозирования.

      Позднее биологические вычислители начали использовать в крупных научных учреждениях.

      Они применяются при обработке наблюдений и анализе сложных экспериментальных данных.

      Высокая стоимость содержания ограничивает распространение таких систем.

      Большинство предприятий продолжают использовать обычные вычислительные машины.

      Считатели устанавливаются на объектах, где их специализированные возможности дают достаточные преимущества.

      ---

      ### Считатели и космическая навигация

      С развитием космической программы биологические вычислители получили новое применение.

      Навигационные комплексы должны обрабатывать данные множества приборов.

      Для определения положения корабля используются оптические наблюдения и радиотехнические измерения.

      Неполные или противоречивые показания требуют дополнительного анализа.

      Считатели обучаются распознавать характерные ошибки измерений и сопоставлять данные различных датчиков.

      В результате они могут помогать штурманам выбирать наиболее достоверные модели текущего положения корабля.

      Точные расчёты траекторий продолжают выполняться обычными вычислительными машинами.

      Биологический компонент участвует в оценке исходной информации и выявлении нестандартных состояний.

      Особенно полезны Считатели, подготовленные для работы с пространственными моделями.

      Такие системы применяются на отдельных исследовательских и военных кораблях.

      Однако высокая стоимость медицинского оборудования препятствует их массовому распространению.

      ---

      ### Галлионные системы и биологические вычислители

      Появление галлионных экранов создало новые задачи в области технической диагностики.

      Работа защитной мембраны зависит от фазовой согласованности многочисленных эмиттеров.

      При повреждении отдельных элементов или изменении механического состояния корпуса может нарушаться устойчивость всего контура.

      Обычные приборы непрерывно регистрируют параметры эмиттеров.

      Быстрое регулирование выполняется специализированной автоматикой.

      Однако прогнозирование сложных нарушений требует сопоставления множества измерений.

      Для решения таких задач используют подготовленных Считателей.

      Биологический вычислитель может распознавать сочетания отклонений, характерные для приближающегося срыва контура.

      Это позволяет предупреждать инженерный персонал об опасных состояниях.

      При этом Считатель не управляет непосредственно всеми высокоскоростными процессами защитного экрана.

      Его физиологические особенности ограничивают скорость отдельных реакций.

      Поэтому работа биологического вычислителя дополняет электронную систему регулирования.

      ---

      ### 2041–2061 — Считатели в эпоху Перехода

      Открытие перехода Вейна—Эшдаун привело к появлению новых требований к навигационным вычислительным комплексам.

      Подготовка перехода требует обработки данных о метрическом фоне и состоянии переходной аппаратуры.

      Точные математические расчёты выполняются специализированными вычислительными машинами.

      Считатели используются для анализа сложных сочетаний измерений.

      Их подготовка включает изучение характерных состояний переходной установки.

      Опытные биологические вычислители могут выявлять отклонения, указывающие на несоответствие наблюдений расчётной модели.

      При этом Считатель получает информацию исключительно через технические интерфейсы.

      Непосредственная чувствительность человеческого мозга к метрическим переходам не установлена.

      Поэтому возможности биологических вычислителей зависят от качества внешних измерительных устройств.

      В течение 2040–2050-х годов подобные системы начали применять на некоторых исследовательских судах и специализированных военных кораблях.

      Однако наличие Считателя не является обязательным условием осуществления перехода.

      Многие корабли используют обычные вычислительные комплексы.

      Считатели устанавливаются преимущественно там, где требуется дополнительная адаптивная обработка информации.

      ---

      ### Считатели на военных кораблях

      Для корабельной службы особенно ценятся добровольные Считатели, сохранившие способность к общению.

      Такие системы могут взаимодействовать с офицерами навигационной и инженерной служб.

      Подготовленный Считатель постепенно приобретает опыт работы с конкретным кораблём.

      Он обучается распознавать характерные особенности его оборудования.

      После продолжительной службы биологический вычислитель может замечать изменения состояния систем, которые ещё не выходят за пределы обычных контрольных допусков.

      Это повышает ценность опытных Считателей.

      Однако перенос такого вычислителя на другой корабль требует повторной адаптации.

      В крупных корабельных комплексах Считатель находится под наблюдением медицинского персонала.

      Техническое обслуживание интерфейсов осуществляют специалисты вычислительной службы.

      Ответственность за принятие решений сохраняется за соответствующими офицерами.

      Результаты работы Считателя рассматриваются как часть информации, предоставляемой корабельными приборами.

      ---

      ### Экономические ограничения

      Создание Считателя требует сложного медицинского оборудования и продолжительной подготовки.

      Преобразование человеческого мозга сопровождается значительными расходами.

      Дополнительные средства требуются для создания нейроинтерфейсов и обеспечения постоянного жизнеобеспечения.

      После преобразования необходимо обучить биологическую систему конкретным вычислительным задачам.

      Этот процесс может занимать значительное время.

      Подготовленные Считатели обладают индивидуальными способностями, что осложняет стандартизацию производства.

      Надёжность каждого комплекса зависит от состояния живой нервной ткани.

      Поэтому установка Считателя на небольшую автономную машину обычно не имеет экономического смысла.

      Обычная автоматика обходится значительно дешевле при выполнении ограниченного набора задач.

      Особенно заметны эти ограничения в военной промышленности.

      Массовое производство автономных боевых машин остаётся затруднённым из-за размеров вычислительной аппаратуры и стоимости адаптивных систем.

      Считатели преимущественно используются на крупных объектах, способных обеспечить необходимое обслуживание.

      ---

      ### Правовое положение добровольных Считателей

      Сохранение личности после преобразования потребовало создания особой системы правового регулирования.

      Добровольный Считатель может продолжать общаться с людьми и выражать собственные решения.

      При этом его существование зависит от сложного медицинского комплекса.

      Возникли вопросы о праве распоряжения имуществом и заключения трудовых договоров.

      Отдельные споры касались ответственности медицинских учреждений за поддержание жизни Считателей.

      Поскольку вычислительный комплекс может принадлежать государству или промышленной компании, возникает необходимость разграничивать право собственности на оборудование и правовой статус биологического компонента.

      В большинстве случаев отношения оформляются специальными договорами.

      Однако единообразная правовая система ещё продолжает формироваться.

      К 2061 году добровольные Считатели обладают признанными гарантиями медицинского обслуживания и защиты от незаконного принудительного использования.

      При этом некоторые вопросы их гражданского статуса остаются предметом судебных разбирательств.

      Особенно сложны дела, связанные с длительной невозможностью общения или изменением когнитивных способностей после преобразования.

      ---

      ### Положение технологии к 2061 году

      К началу Проекта «Икар» Считатели являются признанной частью имперской вычислительной техники.

      Наиболее сложные системы используют человеческий мозг, поддерживаемый в живом состоянии.

      Их вычислительные возможности основываются на нейропластичности и высокой степени параллельной обработки информации.

      Основным методом подготовки человеческих Считателей остаётся кортикальная перепривязка.

      Процедура позволяет приспосабливать отдельные нейронные сети к работе с технической информацией.

      В дальнейшем Считатель проходит продолжительное обучение.

      При этом обычные вычислительные машины сохраняют основную роль в точных математических расчётах и управлении быстрыми процессами.

      Добровольные Считатели в значительной степени сохраняют индивидуальность и память.

      Продолжительная служба может постепенно изменять их способы восприятия и мышления.

      Такие изменения рассматриваются как следствие адаптации нервной системы к искусственной сенсорной среде.

      Каторжные Считатели подвергаются дополнительному необратимому вмешательству, ограничивающему самостоятельную личностную деятельность.

      Они преимущественно используются в специализированных вычислительных учреждениях.

      Несмотря на техническое развитие, эксплуатация биологических вычислителей остаётся дорогостоящей.

      Для работы требуются сложные медицинские установки и постоянное наблюдение.

      Поэтому Считатели сохраняют положение специализированного оборудования, предназначенного для задач, в которых их адаптивные способности оправдывают значительные расходы.

      #### 2061 — Проект «Икар»

      Подготовка первой межзвёздной экспедиции включает разработку сложных навигационных и инженерных вычислительных систем.

      Для выполнения отдельных задач предусматривается использование биологических вычислителей.

      Их работа должна дополнять электронные комплексы, обеспечивающие расчёты перехода и управление корабельным оборудованием.

      Наиболее подготовленные Считатели могут взаимодействовать с экипажами кораблей через специальные интерфейсы.

      При этом ответственность за выполнение перехода и принятие оперативных решений остаётся за назначенными офицерами.

      **К 2061 году Считатели представляют собой дорогостоящие биологические вычислительные системы, использующие способность человеческого мозга к обучению и распределённой обработке информации. Добровольное преобразование сохраняет личность человека, хотя продолжительная работа постепенно изменяет его восприятие окружающего мира. Именно сочетание человеческого опыта с искусственно переобученными нейронными структурами составляет основное преимущество наиболее сложных Считателей.**
