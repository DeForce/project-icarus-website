      ## Планетарное сообщение

      Пассажирские и грузовые перевозки между поверхностью, орбитой и переходной сетью

      ## Общий принцип

      Крупные космические корабли строят и обслуживают на орбитальных верфях. Их корпуса рассчитаны на длительную работу в вакууме. Для доставки людей на поверхность применяются отдельные аппараты, способные выполнять атмосферный спуск и повторный подъём.

      Планетарная гравитация остаётся главным ограничением транспортной системы. Для выхода на орбиту аппарат должен набрать необходимую скорость с помощью реактивной тяги либо получить часть импульса от внешней установки. Переходный реактор для этого не подходит: около массивного небесного тела метрическое поле теряет устойчивость.

      Большинство маршрутов состоит из нескольких участков. Сначала пассажиры достигают орбитального терминала. Затем межпланетный корабль доставляет их к удалённому метрическому якорю, где выполняется переход.

      ## Пассажирские перевозки

      ### Орбитальный пакетбот

      Пакетбот — регулярный пассажирско-почтовый аппарат для линии между космопортом и орбитальной станцией. На распространённых моделях размещается от нескольких десятков до восьмидесяти пассажиров. В состав экипажа входят пилоты и бортовой техник. Пакетбот рассчитан на частые рейсы и быстрый оборот в порту.

      Большую часть полезной массы занимают запасы рабочего тела, силовая конструкция и система теплозащиты. При подъёме с землеподобной планеты пакетбот использует ракетную тягу. Для наиболее тяжёлых условий применяются отделяемые ускорители или многоразовые стартовые ступени. На спуске аппарат гасит скорость в атмосфере, после чего выполняет посадку.

      ### Орбитальный лайнер

      На самых загруженных линиях используют более крупные машины вместимостью примерно от ста до двухсот пассажиров. Их обслуживают оборудованные космопорты с отдельными стартовыми комплексами. Вместимость достигается за счёт большой стартовой массы, поэтому такие аппараты экономически оправданы прежде всего на Центральных мирах.

      Кельвиевые энергетические установки широко применяются в наземной инфраструктуре: они питают производство топлива и системы предполётной подготовки. Отдельные тяжёлые аппараты используют реакторные тепловые ступени, но обычная химическая тяга сохраняет важную роль. Для небольших челноков крупный кельвиевый реактор чаще оказывается слишком тяжёлым.

      ## Устройство пассажирского маршрута

      ### Наземный космопорт

      Крупный космопорт представляет собой промышленный объект с пассажирским терминалом и удалёнными стартовыми площадками. Здесь проводят медицинский допуск, проверку груза и регистрацию пассажиров. Посадка на корабль происходит незадолго до старта, а подготовку двигателя выполняют на отдельной площадке.

      На Центральных мирах разные космопорты могут обслуживать гражданские и военные рейсы. При отправлении с богатой планеты полёт до орбиты остаётся доступной, но дорогой транспортной услугой. Для пассажира главной статьёй расходов часто становится именно подъём с поверхности.

      ### Орбитальный рейд

      Пакетботы прибывают на рейдовую станцию, расположенную на устойчивой орбите. Здесь размещены пассажирские терминалы и причалы для грузового транспорта. Большие корабли принимают пассажиров через шлюзовые галереи либо используют местные портовые катера.

      На орбитальной станции оформляют пересадку и временное хранение багажа. При необходимости здесь можно сменить перевозчика. Дальние корабли получают возможность не расходовать ресурс на атмосферные полёты.

      ### Внешний якорь

      Рейдовая станция и метрический якорь выполняют разные задачи. Первая обслуживает планетарные перевозки, второй обеспечивает переход между удалёнными областями пространства. От орбитального рейда до дальнего якоря требуется обычный космический перелёт. Для переходов высокого порядка станции располагают значительно дальше от планеты.

      ## Тросовые орбитальные комплексы

      На планетах с особенно плотным пассажирским потоком часть подъёмной нагрузки принимает орбитальный тросовый комплекс. Такие установки известны под названием «скайхук», хотя техническая документация обычно использует термин «орбитальный перехватчик».

      Комплекс состоит из длинной вращающейся конструкции с грузозахватным узлом. В расчётный момент узел проходит через точку встречи с быстро движущимся высотным аппаратом. После сцепления трос передаёт ему часть орбитального импульса, сокращая требования к собственному разгонному блоку. Встреча выполняется на большой высоте, вдали от плотных слоёв атмосферы.

      После захвата груза комплекс теряет часть углового момента и должен восстановить расчётный режим. Для этого используется отдельная двигательная система и запас рабочего тела. Тросовый комплекс поэтому требует значительного обслуживания, а его экономическая выгода зависит от постоянного потока рейсов.

      Подобные сооружения строят только на наиболее развитых мирах. Оператор назначает узкие окна сближения и предъявляет строгие требования к состоянию челноков. При непогоде или отклонении от траектории встречу отменяют, а аппарат переходит на предусмотренный аварийный маршрут.

      ## Грузовые перевозки

      Для груза предусмотрена отдельная инфраструктура. Обычные контейнеры доставляют многоразовые грузовые ракеты и орбитальные лихтеры. На небольших рынках они перевозят также промышленное оборудование, требующее осторожного обращения. Крупнейшие узлы используют автоматические грузовые ступени, работающие по расписанию.

      Электромагнитные пусковые установки особенно выгодны на телах с низкой гравитацией и разреженной атмосферой. На Луне длинная разгонная трасса сообщает контейнеру основную часть скорости. После запуска орбитальный буксир корректирует его движение и доставляет к приёмной станции.

      На землеподобных планетах плотная атмосфера осложняет такой запуск. Большое ускорение и аэродинамический нагрев ограничивают допустимые грузы. Поэтому массовые грузовые линии здесь преимущественно используют ракетные системы; электромагнитные комплексы применяют в отдельных специализированных случаях.

      ## Различия между мирами

      |**Категория**|**Обычная инфраструктура**|**Особенность сообщения**|
      |---|---|---|
      |Центральные миры|Несколько космопортов, крупные орбитальные рейды; на самых загруженных направлениях — тросовые комплексы.|Регулярное расписание и большой пассажирский поток.|
      |Средние миры|Один основной космопорт, орбитальный терминал и местный парк пакетботов.|Стоимость рейса зависит от исправности ограниченного числа машин.|
      |Крайние миры|Посадочная площадка, склад топлива; иногда — временный орбитальный причал.|Пассажиры ждут прибытия внешнего челнока. Некоторые поселения обслуживаются по сезонному графику.|

      Такая разница сохраняется и после появления межзвёздных переходов. Якорь обеспечивает связь между системами, однако пассажирский рейс по-прежнему зависит от местного состояния космопорта.

      ## Корабельные катера и служебные аппараты

      Военные каттеры и небольшие межпланетные суда могут перевозить собственный служебный аппарат на шесть–восемь человек. Он предназначен для стыковки и перевозки персонала между кораблями. При подходящей конструкции катер способен садиться на тела с небольшой гравитацией.

      Для самостоятельного подъёма с поверхности землеподобной планеты такому аппарату потребовались бы большие запасы топлива и мощная стартовая система. Поэтому экипаж малого военного корабля обычно пользуется портовым пакетботом. Десантные или специализированные катера могут осуществлять спуск с подготовленной схемой обратного вывода.

      Корабли класса «Перегрин», включая переоборудованный эскорт проекта «Икар», относятся к судам постоянного космического базирования. В ходе обычной службы они принимают снабжение на орбитальном рейде. При высадке офицеров на населённую планету используется местный транспорт.

      ## Промышленность и эксплуатация

      Short Brothers занимает основную нишу атмосферных челноков и тяжёлых пассажирских аппаратов. Cammell Laird строит орбитальные причалы и крупные грузовые лихтеры. Napier поставляет двигатели маневрирования и вспомогательные силовые блоки.

      Marconi выпускает системы связи и посадочной радионавигации. English Electric производит оборудование наземных энергосетей и силовые узлы тросовых комплексов. На крупном космопорте аппаратура нескольких производителей работает как единая транспортная система.

      Высокая стоимость орбитальной инфраструктуры объясняет важную особенность Империи: власть над космопортом часто оказывается практичнее формального контроля над всей планетой. Через него проходят пассажирские перевозки и наиболее дорогие грузы. Остановка стартового комплекса способна надолго нарушить снабжение колонии.

      ## Основные термины

      |**Термин**|**Значение**|
      |---|---|
      |Космопорт|Наземный комплекс запуска, посадки и обслуживания орбитальных аппаратов.|
      |Пакетбот|Регулярный пассажирско-почтовый челнок на маршруте между планетой и орбитой.|
      |Орбитальный лайнер|Крупный многоразовый пассажирский аппарат для интенсивных линий.|
      |Орбитальный рейд|Станция с причалами для пассажирских пересадок и приёма грузов.|
      |Лихтер|Специализированный аппарат для перевозки груза между орбитой и поверхностью.|
      |Орбитальный перехватчик|Тросовый комплекс, передающий разгоняемому аппарату часть орбитального импульса.|
      |Грузовой ускоритель|Электромагнитная разгонная трасса для запуска контейнеров.|
      |Корабельный катер|Малый служебный аппарат для стыковки, осмотра и высадки.|
      |Внешний якорь|Удалённая станция, от которой выполняется метрический переход.|
