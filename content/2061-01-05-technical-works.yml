      ## Двигательные системы космических кораблей

      #### Принципы кораблестроения, энергетики и боевого маневрирования к 2061 году

      ### 1. Общие положения

      К середине XXI века основу космического флота Британской империи составляют корабли, использующие кельвиевые энергетические установки и реактивные двигатели высокой мощности.

      Развитие кельвиевой энергетики позволило создавать двигательные комплексы, значительно превосходящие по характеристикам ранние химические и электрореактивные установки.

      Основным ограничением космического движения остаются законы сохранения энергии и импульса.

      Для разгона корабля необходим выброс рабочего тела. Доступная характеристическая скорость определяется количеством этого вещества и эффективностью двигателя.

      Большая мощность энергетической установки позволяет развивать значительную тягу, но требует соответствующих систем охлаждения.

      Космические корабли Империи преимущественно строятся для эксплуатации вне атмосферы. Большая часть военных и грузовых судов не предназначена для посадки на поверхность планет.

      Для доставки грузов между планетарной поверхностью и орбитальными сооружениями используются специализированные посадочные аппараты.

      ---

      ### 2. Кельвиево-плазменные двигатели

      Основным направлением развития двигательных установок крупных кораблей является использование кельвиевых реакторов для питания мощных плазменных ускорителей.

      В качестве технической основы применяются принципы магнитоплазмодинамических двигателей.

      Рабочее тело подаётся в ускорительную камеру, переводится в состояние плазмы и выбрасывается через магнитное сопло.

      Реактивная сила разгоняет корабль в противоположном направлении.

      В большинстве установок основную энергию обеспечивает кельвиевый реактор. Само рабочее тело представляет собой обычное вещество.

      #### Рабочие тела

      В космической промышленности используются различные вещества в зависимости от назначения судна.

      **Литий** широко применяется в высокопроизводительных магнитоплазменных установках, в том числе на военных кораблях.

      **Водород** используется в двигателях, рассчитанных на высокую скорость истечения.

      **Аргон и ксенон** применяются в специализированных электрореактивных двигателях, а также в отдельных вспомогательных системах.

      **Вода и продукты её переработки** имеют большое значение для снабжения гражданских судов и промышленных буксиров.

      Литий особенно удобен для длительного хранения в твёрдом состоянии. Его использование требует защищённых резервуаров и оборудования для подготовки вещества к подаче в двигатель.

      Кельвий является источником энергии, а Галлеит и Кеплерит сохраняют самостоятельное значение в экзофазной промышленности. Их непосредственное использование в качестве массового реактивного рабочего тела не получает распространения.

      ---

      ### 3. Многорежимная работа двигателя

      Развитие кельвиево-плазменных установок позволило использовать несколько режимов работы одного маршевого двигателя.

      Режимы различаются скоростью истечения рабочего тела, потребляемой мощностью и создаваемой тягой.

      При высокой скорости истечения двигатель экономно расходует рабочее тело.

      При снижении скорости истечения и увеличении массового расхода он может развивать значительно большую тягу.

      Военные установки дополнительно располагают средствами кратковременного повышения энергетической мощности.

      #### Характерные режимы военного корабля

      |Режим|Ускорение|Назначение|
      |---|---|---|
      |Экономичный|0,001–0,01 g|Длительные коррекции и обычное движение|
      |Маневровый|0,05–0,1 g|Перехваты и изменение орбит|
      |Боевой|0,3–0,8 g|Кратковременное изменение траектории|
      |Форсированный|1–2 g|Экстренное уклонение, критический манёвр|

      Указанные значения представляют собой ориентировочные характеристики военных двигательных комплексов, а не единый обязательный стандарт всех кораблей.

      Гражданские суда могут обладать значительно меньшим максимальным ускорением.

      #### Ограничения форсажа

      Форсированный режим сопровождается резким увеличением расхода рабочего тела и тепловой нагрузки.

      Его использование обычно ограничивается несколькими секундами.

      Боевой режим может поддерживаться дольше, однако также расходует значительные ресурсы.

      Ускорение порядка 0,1 g доступно для подготовленных активных манёвров, но не предполагает неограниченной непрерывной работы двигателя.

      Продолжительное движение преимущественно осуществляется в экономичном режиме.

      Повторное применение форсажа требует оценки оставшегося рабочего тела и состояния охлаждения.

      ---

      ### 4. Энергетические ограничения

      Кельвиевые реакторы обладают исключительно высокой удельной энергоотдачей.

      Однако возможность получения большой мощности не устраняет ограничений двигательной установки.

      Для создания ускорения 1 g на корабле массой около 400 тонн необходима тяга приблизительно 3,9 меганьютона.

      Если скорость истечения рабочего тела составляет 10 км/с, кинетическая мощность струи достигает примерно 20 гигаватт.

      С учётом энергетических потерь потребная мощность установки ещё выше.

      Подобные характеристики значительно превосходят возможности обычных электрореактивных двигателей.

      Поэтому боевые кельвиево-плазменные установки используют специализированное высокомощное сопряжение энергетической системы с плазменным ускорителем.

      Этот принцип относится к достижениям кельвиевой энергетики и требует отдельных инженерных решений, выходящих за пределы стандартной электрореактивной техники.

      #### Отвод тепла

      При работе двигателя часть выделяемой энергии остаётся внутри корабля.

      Для её удаления используются радиаторы, передающие тепло в космическое пространство посредством излучения.

      На кораблях также предусматриваются промежуточные теплообменники и системы накопления тепла.

      Во время кратковременного форсирования мощность тепловыделения может превышать возможности штатных радиаторов.

      В таком случае часть тепла временно накапливается в специальных буферах. При необходимости используются системы расходуемого охлаждения.

      Накопленное тепло должно быть впоследствии отведено.

      Тепловая нагрузка является одним из основных факторов, ограничивающих продолжительность боевых режимов.

      ---

      ### 5. Системы охлаждения и радиаторные конструкции

      Крупные космические корабли оснащаются внешними радиаторными поверхностями.

      В Имперском флоте распространены выносные радиаторные конструкции, напоминающие по форме мачты и паруса морских судов.

      Их назначение состоит в обеспечении большой площади излучающей поверхности при относительно небольшом объёме корабля.

      В радиаторных секциях теплоноситель проходит по системе трубопроводов, в том числе по змеевидным контурам.

      Панели выполняются секционными.

      Такая конструкция позволяет изолировать повреждённые участки и продолжать работу с уменьшенной эффективностью.

      На отдельных кораблях радиаторные конструкции могут складываться для обслуживания или уменьшения габаритов переходной оболочки.

      #### Разделение контуров

      Военные корабли обычно имеют несколько независимых систем теплового регулирования.

      Высокотемпературные контуры обслуживают энергетическую установку и маршевый двигатель.

      Отдельные контуры обеспечивают охлаждение вычислительного оборудования и жилых помещений.

      Разделение систем повышает устойчивость корабля к повреждениям и позволяет поддерживать необходимые температурные режимы.

      Повреждение радиаторного оборудования приводит к ограничению доступной мощности.

      Потеря значительной части охлаждения может сделать невозможным использование главного двигателя на форсированных режимах.

      ---

      ### 6. Маршевые, вспомогательные и маневровые двигатели

      Двигательная система военного корабля включает несколько функционально различных установок.

      #### Главный маршевый двигатель

      Предназначен для основного изменения скорости корабля.

      Как правило, располагается вдоль продольной силовой оси корпуса.

      На отдельных судах используется один мощный маршевый двигатель. На более крупных кораблях могут устанавливаться несколько маршевых агрегатов.

      #### Вспомогательные двигатели

      Предназначены для ограниченного самостоятельного перемещения корабля при неисправности основной установки.

      Их тяга значительно меньше тяги главного двигателя.

      Они позволяют выполнить аварийный отход или добраться до ближайшего обслуживающего объекта при достаточном запасе рабочего тела.

      #### Маневровые двигатели

      Располагаются в различных частях корпуса.

      Предназначены для изменения ориентации корабля, стыковки и выполнения небольших коррекций движения.

      Их расположение позволяет создавать вращающий момент относительно центра масс.

      Обычные двигатели ориентации не обеспечивают ускорения, сопоставимого с главным маршевым двигателем.

      Для мощного изменения траектории корабль должен использовать главную установку.

      Управляемое магнитное сопло может допускать ограниченное отклонение вектора тяги без полного разворота корпуса.

      ---

      ### 7. Орбитальное маневрирование

      Космический корабль сохраняет скорость и направление движения после выключения двигателя.

      Разворот корпуса сам по себе не изменяет его траекторию.

      Для изменения орбиты необходимо сообщить кораблю дополнительный импульс.

      Военные корабли используют маневровые режимы для быстрого изменения скорости относительно планет, спутников и других космических объектов.

      Активное изменение траектории применяется при перехвате и уходе от преследования.

      При планировании манёвров учитываются запас рабочего тела и допустимая тепловая нагрузка.

      #### Боевые манёвры

      В космическом бою значительную роль играет прогнозирование движения противника.

      Артиллерийские системы рассчитывают положение цели с учётом её текущей скорости и возможного ускорения.

      Резкое изменение ускорения осложняет расчёт упреждения.

      При значительных дистанциях задержка распространения электромагнитных сигналов дополнительно затрудняет определение текущего положения цели.

      Однако корабль не может надёжно уклониться от уже выпущенного светового луча, реагируя лишь на его появление.

      Маневрирование против лучевого вооружения направлено прежде всего на снижение предсказуемости траектории.

      Для уклонения от ракет большое значение имеют скорость их сближения с целью и оставшееся время до перехвата.

      Таким образом, высокая манёвренность повышает живучесть корабля, но не гарантирует защиту от попадания.

      ---

      ### 8. Метрические якоря и стратегическая мобильность

      После широкого распространения перехода Вейна—Эшдаун организация межпланетных перевозок значительно изменилась.

      Вблизи освоенных планет и спутников создаётся инфраструктура метрических якорей.

      При этом якоря размещаются на расстояниях, соответствующих гравитационным ограничениям технологии перехода.

      Ближайший якорь не обязательно находится непосредственно над поверхностью планеты.

      Перелёт между двумя работающими якорями представляет собой наиболее эффективный вариант переходной перевозки.

      Переход от якоря в свободную область пространства требует большего расхода энергии и отличается более строгими ограничениями.

      Перемещение между якорями позволяет сократить продолжительность межпланетных маршрутов.

      Поэтому обычные двигатели большинства кораблей предназначены прежде всего для движения в пределах планетных систем и между объектами местной инфраструктуры.

      Длительное межпланетное ускорение больше не является основным способом транспортировки грузов и пассажиров.

      #### Военное применение

      При наступательной операции эскадра может совершить переход к якорю в системе назначения.

      При наличии соответствующих возможностей допускается более дорогой переход в свободную область пространства.

      После выхода корабли используют обычные двигатели для построения траектории атаки.

      В ходе сближения применяются маневровые и боевые режимы тяги.

      После выполнения задачи суда направляются к подходящему якорю либо иной допустимой точке перехода.

      Таким образом, переходная технология обеспечивает стратегическую мобильность, а обычные двигательные установки определяют возможности тактического маневрирования.

      ---

      ### 9. Запасы рабочего тела

      Высокая энергетическая мощность двигателя не устраняет необходимость хранения реактивной массы.

      Корабли перевозят запас вещества, достаточный для запланированного изменения скорости.

      На военных судах дополнительно предусматривается резерв для экстренных манёвров и отхода.

      #### Литиевое рабочее тело

      Металлический литий имеет низкую плотность и хранится в твёрдом состоянии при обычной температуре.

      Для хранения 40 тонн вещества требуется около 75 м³ чистого объёма.

      С учётом резервуаров, изоляции и оборудования подачи фактическое пространство для его размещения будет больше.

      Рабочее тело хранится отдельно от жилых помещений и систем водоснабжения.

      #### Ориентировочный расход при форсаже

      Для корабля массой около 400 тонн при скорости истечения 10 км/с:

      |Манёвр|Приблизительный расход лития|
      |---|---|
      |1 g, 5 секунд|2 тонны|
      |1 g, 10 секунд|4 тонны|
      |2 g, 5 секунд|4 тонны|
      |2 g, 10 секунд|8 тонн|

      Значения округлены и предполагают заданную скорость истечения рабочего тела.

      В экономичных режимах расход вещества на единицу изменения скорости значительно меньше.

      Это делает форсаж дорогостоящим способом маневрирования.

      Даже кратковременная серия боевых манёвров может существенно сократить доступную дальность дальнейшего движения.
