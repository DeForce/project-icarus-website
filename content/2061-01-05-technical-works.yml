      ## История галлионного оружия и защитных экранов

      #### 1970–2061 годы

      ### 1970 — Открытие Галлеита

      В 1970 году Имперская антарктическая экспедиция обнаружила в глубоких геологических слоях вещества с необычными физическими свойствами.

      Одним из первых исследованных образцов стал Галлеит.

      Он представлял собой сложную кристаллическую структуру, способную при определённых условиях испускать ранее неизвестные короткоживущие заряженные частицы.

      Эти частицы получили название **галлионов**.

      Исследования показали, что галлионами можно управлять при помощи электромагнитных полей. При этом их существование вне кристаллической решётки было ограничено по времени.

      В ходе первых опытов удалось сформировать направленный поток галлионов.

      Дальнейшие исследования выявили возможность удерживать галлионные частицы в распределённой пространственной конфигурации.

      На основе этих двух эффектов возникли отдельные направления разработки: **галлионное лучевое оружие** и **защитные полевые экраны**.

      Оба направления потребовали создания специализированных энергетических установок.

      ---

      ### 1971–1976 — Первые галлионные установки

      После открытия практических свойств Галлеита исследования получили государственное финансирование.

      В соответствии с Актом о стратегической промышленности 1971 года разработки проводились под надзором Имперского совета стратегической промышленности — ISIB.

      Значительная часть военных заказов была передана предприятиям Vickers-Armstrongs.

      Первые галлионные установки представляли собой крупные лабораторные комплексы.

      Для формирования направленного потока использовались массивные системы электромагнитного управления.

      Поддержание защитного поля требовало ещё более сложного оборудования.

      Обычные промышленные энергетические установки с трудом обеспечивали необходимую мощность.

      Ранние испытания проводились на подготовленных полигонах с отдельными электростанциями.

      В ходе исследований было установлено, что направленный галлионный поток способен передавать значительную энергию материальным объектам.

      При достаточной интенсивности луч вызывал нагрев и разрушение поверхности цели.

      Распределённое галлионное поле обладало иными свойствами.

      Оно могло препятствовать проникновению материальных объектов через ограниченную область пространства.

      К 1976 году появились первые практически пригодные экспериментальные образцы лучевых установок и защитных экранов.

      Их эксплуатация оставалась исключительно дорогой.

      ---

      ### Галлионная мембрана

      Защитный экран представляет собой пространственную мембрану, сформированную стабилизированным галлионным полем.

      Её свойства отличаются от обычного материального препятствия.

      Мембрана взаимодействует со связанными структурами вещества в зависимости от их характерного размера и физических свойств.

      Отдельные нейтральные молекулы газов способны свободно проходить через поле.

      Более крупные материальные объекты испытывают сопротивление, препятствующее пересечению мембраны.

      При этом скорость движения сама по себе не определяет возможность проникновения.

      Медленно движущийся человек встречает практически такое же непроницаемое препятствие, как и при попытке быстрого пересечения.

      Пуля при столкновении с работающим экраном останавливается или отклоняется. В зависимости от энергии удара она может деформироваться либо разрушиться.

      Мембрана не имеет физических отверстий установленного размера. Её проницаемость определяется характером взаимодействия вещества с галлионной структурой.

      При уменьшении характерного размера частиц взаимодействие постепенно ослабевает.

      Поэтому отдельные мелкодисперсные частицы могут проникать через защитное поле.

      Для плотных потоков частиц характерно более сильное взаимодействие с мембраной. При высокой концентрации поток способен создавать значительную нагрузку на экран.

      В результате защитная мембрана хорошо противодействует обычным снарядам и осколкам, но допускает прохождение газов и части мелкодисперсных веществ.

      ---

      ### Радиационные свойства экрана

      Одним из важнейших результатов исследований стало обнаружение способности галлионного поля взаимодействовать с ионизирующим излучением.

      Этот эффект связан с особыми свойствами галлионной структуры и отличается от механического взаимодействия мембраны с материальными объектами.

      Заряженные частицы высокой энергии эффективно отклоняются защитным полем.

      Высокоэнергетическое электромагнитное излучение также взаимодействует с мембраной.

      В результате экран способен значительно снижать радиационную нагрузку на защищаемый объект.

      Наиболее высокая эффективность достигается при защите от потоков заряженных частиц, в том числе возникающих во время солнечной активности.

      Рентгеновское и гамма-излучение ослабляются в зависимости от характеристик установки.

      Нейтронное излучение также частично ослабляется, однако требует дополнительных средств защиты.

      Видимый свет и обычные радиосигналы практически свободно проходят через мембрану.

      Галлионный экран остаётся прозрачным при штатной работе.

      Поглощённая и отклонённая энергия создаёт дополнительную нагрузку на защитную систему.

      Поэтому эффективность радиационной защиты ограничивается мощностью установки и возможностями охлаждения.

      Наличие полевого экрана не исключает необходимости обычной радиационной защиты реакторов и жилых помещений.

      ---

      ### Энергетические ограничения

      Основным препятствием для широкого распространения галлионных технологий является потребность в электроэнергии.

      Формирование устойчивой мембраны требует непрерывной работы генераторов.

      Увеличение защищаемого объёма сопровождается ростом энергопотребления.

      Особенно дорого обходится повышение плотности поля.

      Первые защитные установки могли работать только при подключении к крупным внешним источникам энергии.

      Это ограничивало их применение стационарными объектами.

      Оборудование также занимало значительный объём.

      Помимо галлионного генератора требуются электромагнитные эмиттеры, управляющая аппаратура и мощная система охлаждения.

      Даже после совершенствования конструкции основные элементы установки остаются крупными.

      Попытки создания индивидуальных защитных экранов не привели к появлению пригодного для вооружённых сил оборудования.

      Масса генератора и потребность в энергии значительно превышают допустимые характеристики переносного снаряжения.

      ---

      ### 1978–1993 — Кельвиевая энергетика

      Испытания первого устойчивого кельвиевого реактора на Первой Космической Станции в 1978 году открыли новые возможности для галлионных технологий.

      Высокая энергетическая мощность реакторов позволила уменьшить зависимость лучевых установок от стационарных электростанций.

      Однако сами реакторы остаются дорогими и достаточно крупными.

      Их конструкция требует специальных систем охлаждения и радиационной защиты.

      Первые корабельные галлионные установки размещались преимущественно на экспериментальных космических аппаратах.

      Широкое распространение ограничивалось недостатком Кельвия.

      После открытия промышленного синтеза Кельвия в 1993 году ситуация постепенно изменилась.

      Развитие реакторостроения позволило оснащать крупные космические корабли собственными мощными энергетическими установками.

      К этому времени Vickers-Armstrongs занималась разработкой корабельных лучевых орудий и защитных систем.

      English Electric специализировалась на высоковольтном оборудовании и системах питания галлионных эмиттеров.

      Rolls-Royce поставляла кельвиевые реакторы.

      Совместное использование продукции нескольких предприятий является стандартом военного кораблестроения.

      ---

      ### Геометрия защитного поля

      Первые галлионные экраны формировали относительно простые замкнутые оболочки.

      Исследования показали, что энергетические затраты зависят от площади и геометрии защитной поверхности.

      Наиболее выгодной формой для компактного объекта является сфера.

      При увеличении длины защищаемого объекта мембрану можно вытягивать, придавая ей форму эллипсоида.

      Такая конфигурация требует более сложной стабилизации.

      На космических кораблях защитные оболочки обычно повторяют общие пропорции корпуса, сохраняя значительное расстояние между мембраной и наружными конструкциями.

      Для поддержания галлионного потока применяются замкнутые тороидальные контуры циркуляции.

      Тороидальная схема позволяет обеспечить устойчивую работу генератора при сравнительно небольших потерях энергии.

      При этом форма циркуляционного контура внутри установки не определяет непосредственно форму наружной защитной оболочки.

      Дальнейшее развитие технологий привело к созданию сегментированных экранов.

      В таких системах отдельные области мембраны могут регулироваться независимо.

      Сегментирование повышает сложность оборудования и энергопотребление, но позволяет временно открывать ограниченные участки защитной поверхности.

      Эта возможность особенно важна для военных кораблей.

      ---

      ### Стабильность защитного контура

      Галлионная мембрана удерживается системой согласованных эмиттеров.

      Для устойчивой работы необходимо поддерживать расчётную конфигурацию поля и согласованность его отдельных участков.

      Эмиттеры закрепляются на несущей конструкции защищаемого объекта.

      При столкновении материального тела с мембраной возникающая механическая нагрузка передаётся через полевую систему на эмиттеры и их крепления.

      Экран может остановить снаряд, но не устраняет его импульс.

      Часть энергии столкновения рассеивается и отводится системой охлаждения. Остальная нагрузка воспринимается силовой конструкцией установки.

      При превышении допустимых значений возможна потеря устойчивости защитного контура.

      Особенно опасны резкие механические воздействия, сопровождающиеся деформацией несущей конструкции.

      Небольшие отклонения компенсируются управляющей аппаратурой.

      Если компенсировать нагрузку невозможно, автоматика снижает плотность поля или отключает отдельные сегменты.

      При тяжёлых повреждениях может произойти полный срыв защитной оболочки.

      Такое событие отличается от локального пробоя экрана под воздействием оружия.

      **Пробой** возникает в результате разрушения отдельного участка мембраны.

      **Срыв контура** связан с нарушением согласованности всей системы либо значительной её части.

      ---

      ### Ускорение и механические перегрузки

      Устойчивость галлионной мембраны зависит от характера механических воздействий на установку.

      Плавное ускорение защищаемого объекта само по себе не приводит к разрушению поля.

      Система эмиттеров способна сохранять согласованность при нормальной работе корабельных двигателей.

      Допустимые ускорения определяются конструкцией генератора и прочностью его креплений.

      Вместе с тем резкие удары и деформация корпуса способны нарушить устойчивость даже мощной системы.

      Особенно опасны ситуации, когда мембрана вынуждена воспринимать значительную механическую нагрузку в течение продолжительного времени.

      Попытка использовать защитный экран для разрушения массивной преграды может привести к перегрузке эмиттеров.

      При столкновении двух крупных объектов экран также подвергается воздействию, значительно превышающему обычные боевые нагрузки.

      Поэтому наличие защитной мембраны не делает безопасными столкновения кораблей или тяжёлой наземной техники.

      При падении экранированной установки на поверхность планеты торможение через мембрану вызывает перегрузку её несущей конструкции.

      В зависимости от обстоятельств поле может сохранить устойчивость при первоначальном ударе, однако не обеспечивает полного устранения последствий резкого торможения.

      Для безопасной посадки по-прежнему требуются специальные средства замедления.

      ---

      ### Раскрытие защитного поля

      Перед включением экрана управляющая система рассчитывает расположение защитной оболочки относительно окружающих предметов.

      Штатное раскрытие производится после проверки допустимости выбранного контура.

      На космических кораблях особое внимание уделяется расстоянию между мембраной и наружными конструкциями.

      Пересечение защитной оболочкой корпуса способно привести к серьёзным повреждениям.

      При штатной работе система блокирует раскрытие поля, если расчётная поверхность проходит через массивный объект.

      В наземных условиях учитываются особенности рельефа.

      Трава и другие гибкие предметы, пересекающие границу мембраны, могут смещаться при формировании поля.

      Мелкие частицы грунта также могут вытесняться из области формирования защитного контура.

      Крупные камни и деревья создают значительно большую нагрузку.

      При обнаружении такого препятствия автоматика прекращает раскрытие либо изменяет конфигурацию мембраны в допустимых пределах.

      Принудительное формирование поля через массивную конструкцию может вызвать разрушение материала и повреждение самой защитной установки.

      По этой причине эксплуатация экрана требует предварительной проверки защищаемого пространства.

      ---

      ### Наземные защитные установки

      Развитие галлионных экранов сопровождалось попытками использовать их для защиты наземных объектов.

      Наибольшую практическую ценность имеют стационарные установки.

      Генераторы размещаются в укреплённых помещениях и подключаются к крупным источникам энергии.

      Эмиттеры монтируются на подготовленных основаниях.

      Это обеспечивает высокую механическую устойчивость и позволяет поддерживать экран в течение продолжительного времени.

      Для наземной защиты обычно используется купольная форма мембраны.

      Нижняя граница такого экрана располагается вблизи поверхности грунта.

      При этом мембрана не обеспечивает полноценной защиты от подземного проникновения.

      Наиболее важные военные объекты оснащаются заглублёнными защитными контурами.

      Их строительство требует подготовки фундаментов и установки дополнительных эмиттеров.

      Стоимость подобных сооружений высока.

      Поэтому капитальные галлионные экраны используются преимущественно для защиты стратегических объектов и крупных военных баз.

      На промышленных предприятиях они также могут применяться для защиты особенно опасного оборудования.

      ---

      ### Ограничения мобильных наземных экранов

      Создание мобильных галлионных установок рассматривалось военными инженерами на протяжении нескольких десятилетий.

      Основной проблемой остаются масса и стоимость оборудования.

      Для самостоятельной работы мобильная установка нуждается в мощном источнике энергии.

      Использование кельвиевого реактора требует размещения дополнительной системы охлаждения и радиационной защиты.

      Кроме того, необходимо обеспечить место для самого галлионного генератора и эмиттеров.

      Даже при установке оборудования на тяжёлое автомобильное шасси полезный объём машины оказывается ограничен.

      Отдельную проблему представляет механическая устойчивость.

      Движение по пересечённой местности сопровождается вибрациями и изменениями положения несущей конструкции.

      При соприкосновении мембраны с грунтом возникает дополнительная нагрузка.

      Полностью замкнутая защитная оболочка также мешает работе колёс и гусениц.

      Поэтому мобильные установки требуют применения специальных защитных секторов, оставляющих ходовую часть открытой.

      Такие системы отличаются высокой сложностью и уступают стационарным экранам по энергетической эффективности.

      Разрабатывались тяжёлые платформы, способные перевозить генератор и разворачивать защитное поле после остановки.

      Однако их стоимость была сопоставима с ценой нескольких единиц специализированной военной техники.

      Массовое производство подобных комплексов признали экономически нецелесообразным.

      **К 2061 году мобильные наземные экраны остаются редким оборудованием инженерных и стратегических подразделений.**

      В обычных сухопутных войсках продолжают использовать броневую защиту.

      ---

      ### Беспилотные защищённые платформы

      Разработка автономных наземных боевых машин сталкивается с аналогичными ограничениями.

      Отсутствие экипажа позволяет уменьшить объём оборудования жизнеобеспечения, однако практически не влияет на размеры галлионного генератора.

      Полноценная защитная система по-прежнему требует мощного энергетического источника.

      Для управления автономной платформой также необходима сложная вычислительная аппаратура.

      Ограниченные возможности миниатюризации электронных систем затрудняют создание компактных машин, способных самостоятельно действовать в сложной боевой обстановке.

      Биологические Считатели используются преимущественно в крупных вычислительных комплексах и не подходят для массового оснащения небольших беспилотных аппаратов.

      Поэтому стоимость автономной экранированной платформы значительно превышает затраты на вооружение и подготовку обычного пехотного подразделения.

      Военное руководство предпочитает использовать дорогостоящие галлионные установки там, где они защищают стратегически важные объекты.

      Небольшие беспилотные разведывательные аппараты продолжают существовать, но обычно обходятся без полевых экранов.

      ---

      ### Галлионное лучевое оружие

      Галлионный луч представляет собой направленный поток частиц, испускаемых активным Галлеитом.

      В отличие от лазерного оружия, поражающее действие галлионного луча связано с переносом энергии и взаимодействием галлионов с веществом.

      Формирование луча требует специализированной электромагнитной системы.

      Для сохранения направленности потока используются поля, удерживающие частицы в расчётной конфигурации.

      Поскольку галлионы существуют ограниченное время, дальность действия оружия также ограничена.

      В вакууме направленный поток сохраняет устойчивость значительно лучше, чем в плотной атмосфере.

      При прохождении через атмосферу взаимодействие с газами вызывает дополнительные потери и снижает эффективность установки.

      Это является одной из причин преимущественного использования галлионного оружия в космосе.

      При попадании луча в незащищённую материальную цель происходит интенсивная передача энергии.

      Поверхность цели быстро нагревается.

      При продолжительном воздействии возможно разрушение материала и повреждение внутренних конструкций.

      Мощные галлионные орудия требуют значительного охлаждения.

      Их скорострельность и допустимая продолжительность работы ограничиваются энергетическими возможностями корабля.

      ---

      ### Взаимодействие луча с защитным экраном

      Галлионное оружие является особенно эффективным средством борьбы с полевыми экранами.

      Причиной является взаимодействие направленного потока с самой галлионной структурой мембраны.

      При попадании луча возникает локальное нарушение устойчивости защитного поля.

      Управляющая система пытается восстановить конфигурацию.

      Это сопровождается интенсивным расходом энергии.

      Если мощность обстрела превышает возможности защитного генератора, плотность мембраны в поражённой области снижается.

      При дальнейшем воздействии возникает пробой.

      После пробоя луч может воздействовать непосредственно на корпус защищаемого объекта.

      Таким образом, галлионный луч одновременно создаёт нагрузку на защитный генератор и способен поражать материальную цель.

      Обычные кинетические боеприпасы взаимодействуют с мембраной преимущественно механически.

      При сопоставимых условиях они обычно менее эффективны для разрушения исправного экрана.

      Тем не менее тяжёлые снаряды и высокоэнергетические столкновения способны перегружать защитную систему.

      Поэтому артиллерийские кинетические системы полностью не исчезают из вооружения.

      ---

      ### Сегментированные экраны и огневые окна

      Развитие корабельного лучевого оружия потребовало совершенствования систем защиты.

      Ранние корабельные экраны создавали единую замкнутую оболочку.

      Такая система была сравнительно простой и энергетически эффективной.

      Однако полностью работающая мембрана препятствовала прохождению собственных материальных боеприпасов.

      Галлионные лучи также взаимодействовали с защитным полем корабля.

      Для ведения огня требовалось временно отключать защиту.

      Позднее появились сегментированные галлионные системы.

      Они позволяют на короткое время снижать плотность поля в выбранном секторе.

      На военных кораблях такие участки получили название **огневых окон**.

      При подготовке выстрела система управления согласовывает работу орудия с защитным экраном.

      Необходимый сектор открывается непосредственно перед выстрелом и закрывается после завершения огневого воздействия.

      Появление огневых окон существенно повысило эффективность корабельного вооружения.

      Одновременно возникла новая тактическая уязвимость.

      Во время открытия огневого окна соответствующая часть корпуса временно лишается полной полевой защиты.

      На современных кораблях длительность открытия сокращается за счёт более совершенной системы управления.

      Тем не менее риск попадания через огневое окно сохраняется.

      ---

      ### Защитные экраны и работа двигателей

      Полупроницаемость галлионной мембраны обеспечивает свободное прохождение отдельных молекул газа.

      Однако плотный поток рабочего тела реактивного двигателя может создавать значительную нагрузку на защитную поверхность.

      Поэтому для нормальной работы двигательных установок требуется учитывать расположение кормовых сегментов экрана.

      На большинстве военных кораблей сопла располагаются в специально предусмотренных областях защитного контура.

      Во время работы маршевых двигателей соответствующие участки мембраны частично открываются либо переводятся в режим пониженной плотности.

      Это позволяет выводить реактивную массу за пределы оболочки.

      Подобная конструкция учитывается ещё при проектировании корпуса.

      Корабли с мощными маневровыми двигателями обычно имеют более сложную систему сегментирования.

      Для гражданских транспортов часто применяются упрощённые схемы с ограниченным количеством защищённых секторов.

      ---

      ### 1995–2040 — Распространение корабельных экранов

      После начала промышленного освоения Солнечной системы галлионные системы постепенно получили распространение на крупных кораблях.

      Высокая стоимость ограничивала их применение прежде всего военным и стратегическим флотом.

      Для гражданских судов экран представлял значительную ценность как средство защиты от радиации и опасных столкновений.

      Однако его стоимость существенно увеличивала цену корабля.

      Поэтому многие грузовые суда использовали пассивную защиту корпуса и сравнительно простые системы радиационного экранирования.

      На пассажирских судах, предназначенных для длительных путешествий, галлионная защита встречалась чаще.

      Военные корабли получали более мощные генераторы.

      Их защитные системы были рассчитаны на интенсивные механические нагрузки и прямое воздействие галлионного оружия.

      Проектирование военного корабля учитывает расположение эмиттеров как один из основных факторов конструкции корпуса.

      Важнейшие элементы защитной системы размещаются внутри бронированных отсеков.

      Эмиттеры соединяются с силовыми элементами корпуса.

      Такой подход повышает устойчивость экрана во время манёвров и боевых повреждений.

      ---

      ### Галлеит и ограничения космической промышленности

      Промышленное применение галлионных технологий продолжает зависеть от поставок Галлеита.

      Основные месторождения вещества находятся на Земле.

      Исследования также показали, что активная кристаллическая структура Галлеита постепенно деградирует при длительном нахождении вне среды, близкой к земной.

      Специальные транспортные контейнеры позволяют замедлить этот процесс.

      Однако их применение значительно увеличивает стоимость снабжения.

      Поэтому корабельные генераторы нуждаются в регулярном техническом обслуживании и периодической замене активных компонентов.

      Для Имперского флота поставки Галлеита имеют стратегическое значение.

      Крупные военные базы содержат специальные хранилища и ремонтные мастерские.

      Местные администрации удалённых поселений стремятся поддерживать резервные запасы.

      Ограниченная доступность Галлеита также сдерживает распространение экранов в гражданской промышленности.

      Трудности независимых марсианских колоний с обеспечением галлионных установок остаются предметом особого внимания Имперского правительства.

      Способ, которым Марс сумел сохранить собственное производство и эксплуатацию таких систем, остаётся неизвестен британским специалистам.

      ---

      ### 2041 — Поле Вейна

      В 2041 году исследования защитных экранов на станции в системе Юпитера привели к открытию нового режима работы галлионного поля.

      Группа доктора Эдмунда Вейна занималась увеличением радиуса защитной оболочки.

      Для этого исследователи уменьшали плотность галлионного поля, сохраняя его пространственную согласованность.

      Полученная система могла охватывать значительно больший объём, чем обычный экран.

      Однако её защитные свойства резко снижались.

      Такая оболочка уже не могла эффективно останавливать материальные объекты или обеспечивать полноценную радиационную защиту.

      Дальнейшие эксперименты с этой конфигурацией привели к Юпитерианскому инциденту и открытию перехода Вейна—Эшдаун.

      Впоследствии исследования переходных оболочек выделились в отдельное направление.

      Несмотря на общую технологическую основу, защитные галлионные экраны и переходные поля получили различное назначение.

      ---

      ### 2048–2061 — Галлионные системы Эры Перехода

      Развитие переходной технологии увеличило значение космического флота.

      Военные корабли получили возможность действовать на значительно более удалённых маршрутах.

      Это повысило требования к автономности корабельных энергетических систем.

      Крупные военные суда оснащаются кельвиевыми реакторами, обеспечивающими работу двигателей и галлионного оборудования.

      При этом энергетические возможности корабля остаются ограниченными.

      Интенсивное использование лучевого оружия увеличивает нагрузку на системы питания и охлаждения.

      Поддержание плотного защитного экрана также требует значительной мощности.

      Поэтому во время боя командование вынуждено распределять энергию между вооружением и защитой.

      Наиболее современные военные корабли оснащены системами автоматического управления отдельными сегментами поля.

      Они позволяют перераспределять мощность в зависимости от направления угрозы.

      В отдельных случаях экипаж может ослаблять защиту менее опасного сектора ради усиления повреждённого участка.

      Такая практика является важной частью подготовки артиллерийских офицеров.

      Развитие защитных экранов также повлияло на тактику космического боя.

      Корабли стремятся поражать противника галлионными лучами, нарушая устойчивость его поля.

      После ослабления защиты становится возможным эффективное применение других видов вооружения.

      При этом тяжёлое лучевое оружие остаётся дорогим и требует сложного обслуживания.

      На небольших военных каттерах устанавливаются относительно лёгкие галлионные орудия.

      Их возможности ограничиваются мощностью штатного реактора.

      ---

      ### Положение галлионных технологий к 2061 году

      К моменту отправления Проекта «Икар» галлионное оружие и защитные экраны занимают важное место в военной промышленности Британской империи.

      Основными производителями корабельных систем остаются Vickers-Armstrongs и English Electric.

      Энергетическое оборудование поставляется Rolls-Royce и другими предприятиями, работающими по государственным контрактам.

      Галлионное лучевое оружие используется преимущественно на крупных военных кораблях и стационарных оборонительных объектах.

      Защитные экраны применяются на стратегически важных сооружениях и космических судах.

      Наиболее распространённой формой корабельной защиты является замкнутая мембрана, разделённая на управляемые сегменты.

      Мембрана препятствует прохождению крупных материальных объектов и обеспечивает значительное ослабление ионизирующего излучения.

      При этом газы и отдельные мелкодисперсные частицы могут проходить через поле.

      Устойчивость экрана зависит от состояния генератора и механической нагрузки на систему эмиттеров.

      Корабельные установки рассчитываются на работу при обычных манёврах и боевых воздействиях.

      Однако столкновения с массивными объектами и серьёзные деформации корпуса могут вызвать срыв защитного контура.

      Высокая стоимость оборудования ограничивает распространение галлионных технологий на суше.

      Мобильные наземные установки остаются редкими из-за необходимости размещения самостоятельного энергетического источника и сложной системы стабилизации.

      Создание малогабаритных экранированных боевых машин по-прежнему остаётся экономически невыгодным.

      Поэтому основой вооружения сухопутных войск остаются обычные огнестрельные и артиллерийские системы.

      **К 2061 году галлионные технологии являются основой вооружения и защиты космического флота, однако их промышленная сложность и стоимость сохраняют разграничение между тяжёлой корабельной техникой и обычными средствами ведения наземной войны.**
