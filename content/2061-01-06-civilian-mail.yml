articles:
  - key: inspection-note
    title: Служебная запись № 1140/11 — рекламные вкладыши
    category: mail-inserts
    relatedArticles:
      - insert-acquaintances
      - insert-radiator-cleaning
      - insert-insurance
      - insert-warehouse-sale
      - insert-fortune-teller
      - insert-inheritance
    body: |
      ## СЛУЖЕБНАЯ ЗАПИСЬ № 1140/11

      **Составил:** инспектор гражданской почты Э. Марш
      **Место:** узел связи «Пересадочная», гражданский сектор
      **Основание:** плановый досмотр почтовых отправлений за первую декаду января 2061 года.

      При досмотре отправлений выявлены рекламные вкладыши коммерческого содержания, приложенные к письмам получателей без их ведома. Вкладыши не несут обязательных реквизитов лицензии, не содержат сведений об издателе и в ряде случаев дают обещания, не поддающиеся проверке.

      Вкладыши изъяты, зафиксированы и приобщены к настоящей записи. Администрации узла вынесено предписание прекратить приём подобных материалов к пересылке. Досмотр продолжается.

      **Приложения:** шесть вкладышей (см. связанные материалы).

  - key: insert-acquaintances
    title: Знакомства в вашем секторе
    category: mail-inserts
    relatedArticles: []
    body: |
      ## ЗНАКОМСТВА В ВАШЕМ СЕКТОРЕ !!!

      Офицерши, вдовы капитанов и скучающие пассажирки первого класса ЖДУТ ВАШЕГО СИГНАЛА.

      Дальние рейсы не должны быть одинокими! Сотни анкет. Фотографии по запросу. Дискретность гарантируем — ваш корабельный инженер никогда не узнает.

      Не откладывайте счастье на после перехода! Сигнальный код 77-114, бокс 9, торговая палуба. Работаем круглосуточно, без выходных и перерывов на радиационные бури.

  - key: insert-radiator-cleaning
    title: Чистим радиаторные паруса
    category: mail-inserts
    relatedArticles: []
    body: |
      ## ЧИСТИМ РАДИАТОРНЫЕ ПАРУСА. ДЁШЕВО. БЫСТРО.

      Теплоноситель циркулирует плохо? Мачты греются? Соседи по доку жалуются на запах?

      Бригада опытных специалистов (свой стыкодел и свой сварщик!) почистит радиаторные паруса любого класса корабля за один стыковочный цикл. Промывка, продувка, замена секций. Гарантия — до конца рейса.

      Цены от трёх фунтов за секцию. Скидка пенсионерам флота и семьям с тремя и более детьми.
      Звоните: внутренний канал 4-18. Спрашивайте дядю Ким.

  - key: insert-insurance
    title: Ваш полис заканчивается!
    category: mail-inserts
    relatedArticles: []
    body: |
      ## ВАШ ПОЛИС ЗАКАНЧИВАЕТСЯ!

      Согласно нашим записям, страховка вашего судна и экипажа ЗАКАНЧИВАЕТСЯ уже на этой неделе.

      Что будет, если при переходе зашторит корпус? Кто оплатит декомпрессию? Кто кормить будет ваших близких?

      Компания «Взаимное доверие» предлагает полный пакет: корпус, переход, потеря трудоспособности, несчастный случай в открытом космосе. Полис от двенадцати фунтов в год. Оформление за один день, без осмотра судна и лишних вопросов.

      Предложение действует ТОЛЬКО ДО КОНЦА МЕСЯЦА (каждого месяца).

      Офис на причале 3, будни с девяти до шести.

  - key: insert-warehouse-sale
    title: Распродажа склада
    category: mail-inserts
    relatedArticles: []
    body: |
      ## РАСПРОДАЖА СКЛАДА. ПОСЛЕДНИЙ ДЕНЬ.

      Склад вещевого довольствия убыточен! Владелец ликвидирует торговлю! ВСЁ ПО СЕБЕСТОИМОСТИ, а местами ниже!

      Костюмы скафандровые — от пяти фунтов. Рационы походные (годность не гарантируем, внешний вид отличный) — десять штук за фунт. Берцы корабельные, канаты, бочки, предметы без владельца — дёшево, много, срочно.

      Успейте! Последний день распродажи — сегодня. (И завтра. И каждый следующий день.)

      Склад 12, нижняя галерея. Приходите рано — разбирают быстро.

  - key: insert-fortune-teller
    title: Ясновидящая мадам Цетта
    category: mail-inserts
    relatedArticles: []
    body: |
      ## ЯСНОВИДЯЩАЯ МАДАМ ЦЕТТА

      Вернёт супруга. Вернёт деньги. Вернёт удачу после неудачного перехода.

      Сниму негатив с корабля и экипажа. Погадаю на картах звёздного неба. Скажу, ждать ли вас дома. Найду, кто портит ваши расчёты перехода.

      Помогаю там, где бессильны врачи, инженеры и адвокаты. Результат с первого визита. Консультация — два фунта, полный обряд — семь.

      Приём по предварительной договорённости. Не доверяйте шарлатанам — доверьтесь мадам Цетте. Палуба жилого уровня, дверь без номера. Стучите дважды.

  - key: insert-inheritance
    title: Деловое предложение (строго конфиденциально)
    category: mail-inserts
    relatedArticles: []
    body: |
      ## ДЕЛОВОЕ ПРЕДЛОЖЕНИЕ (СТРОГО КОНФИДЕНЦИАЛЬНО)

      Уважаемый капитан!

      Обращаюсь к Вам с просьбой о доверии и оговариваю конфиденциальность. При разборе архива усопшего контрадмирала О. мной обнаружен невостребованный счёт на сумму 4 800 000 имперских фунтов. Законный наследник не найден, а банковские правила не позволяют мне, простому служащему канцелярии, вступить в свои права.

      Вам, как человеку чести, предлагаю содействие: Вы выступаете доверенным получателем, я обеспечиваю документы. Вознаграждение Ваше — сорок процентов. Прошу лишь возместить расходы на оформление бумаг (шестьдесят фунтов, пересылаются авансом).

      Прошу ответить по защищённому каналу. Время не терпит — канцелярия интересуется архивом.
