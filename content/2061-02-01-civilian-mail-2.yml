articles:
  - key: inspection-note-february
    title: Служебная запись № 1140/14 — рекламные вкладыши, вторая партия
    category: mail-inserts
    relatedArticles:
      - insert-elixir
      - insert-home-work
      - insert-illuminators
      - insert-gold-buyer
      - insert-lottery-win
      - insert-chain-letter
    body: |
      ## СЛУЖЕБНАЯ ЗАПИСЬ № 1140/14

      **Составил:** инспектор гражданской почты Э. Марш
      **Место:** узел связи «Пересадочная», гражданский сектор
      **Основание:** внеплановый досмотр почтовых отправлений первой декады февраля 2061 года.

      В нарушение предписания № 1140/11 вкладыши коммерческого содержания по-прежнему поступают к пересылке и достигают получателей. Администрация узла отвечает, что «отличить вкладыш от письма бывает трудно». Инспекция такой ответ не принимает.

      Выявленная партия изъята, зафиксирована и приобщена к делу. Материалы переданы в канцелярию узла для разбирательства. Досмотр продолжается.

      **Приложения:** шесть вкладышей (см. связанные материалы).

  - key: insert-elixir
    title: Эликсир бодрости доктора Скара
    category: mail-inserts
    relatedArticles: []
    body: |
      ## ЭЛИКСИР БОДРОСТИ ДОКТОРА СКАРА

      Устали от тяжести в невесомости? Бессонница после переходов? Кости ноет, как у старого корабля?

      Эликсир доктора Скара — травяной состав, проверенный в тридцати семи системах! Восстанавливает силы, зрение и уверенность в себе. Одна ложка утром — и радиационный фон Вам не страшен!

      Бутылка — один фунт, трёхбутылочный курс — два с половиной. Торопитесь: тираж ограничен, доктор стар и больше не варит.
      Продажа на причале 5, палатка с жёлтой вывеской. Вопросов не задаём — ответов не знаем.

  - key: insert-home-work
    title: Работа на дому — 5000 фунтов в неделю
    category: mail-inserts
    relatedArticles: []
    body: |
      ## РАБОТА НА ДОМУ — 5000 ФУНТОВ В НЕДЕЛЮ!!!

      Набираем сотрудников! Оплата еженедельно, опыт не нужен, выходные по желанию.

      Обязанности просты: принимать почтовые отправления, пересылать их дальше по списку, вести учёт. Всё оборудование предоставляем. Вознаграждение — пять тысяч фунтов в неделю плюс премия за срочность.

      Требования: доверчивость, свободное время, отсутствие лишних вопросов.

      Ждём Вашего отклика. Залог за оборудование — двадцать фунтов (возвращается после первой недели, гарантируем). Бокс 114, палуба грузового уровня.

  - key: insert-illuminators
    title: Утепление иллюминаторов
    category: mail-inserts
    relatedArticles: []
    body: |
      ## УТЕПЛЯЕМ ИЛЛЮМИНАТОРЫ. ЗА ОДИН ДЕНЬ. С ГАРАНТИЕЙ.

      В каюте дует? Стёкла потеют от дыхания? Платите за воздух больше соседей?

      Наша бригада за один день установит Вам иллюминаторы нового поколения: теплые, тихие, звёздный свет не искажают. Немецкая лента, имперская совесть. Выезд на осмотр — бесплатно, обязательств ни к чему.

      Каюты любого класса: от матросской до капитанской. Офицерам флота — скидка при предъявлении документов.
      Звоните: внутренний канал 9-99. Мастер Глоухолл лично отвечает до восьми вечера.

  - key: insert-gold-buyer
    title: Скупка. Дорого. Сразу наличными.
    category: mail-inserts
    relatedArticles: []
    body: |
      ## СКУПКА. ДОРОГО. СРАЗУ НАЛИЧНЫМИ.

      Куплю золотые и серебряные вещи: галуны, приборы, часы, награды, монеты, столовое серебро, предметы без документов и с документами.

      Оценка при Вас, за пять минут. Деньги сразу, без очередей и вопросов происхождения. Сам выеду в любой сектор узла.

      Цены выше биржевых! (Биржевых цен на металл не существует — но наши цены всё равно выше.)

      Ищите столик с красной лампой на торговой палубе, работаем со второй половины дня. Спросите у любого — все знают.

  - key: insert-lottery-win
    title: Поздравляем! Ваш билет выиграл
    category: mail-inserts
    relatedArticles: []
    body: |
      ## ПОЗДРАВЛЯЕМ! ВАШ БИЛЕТ ВЫИГРАЛ!

      По итогам жеребьёвки Объединённой лотереи дальних систем Ваш билет № 000000 признан выигрышным!

      Ваш выигрыш: 250 000 имперских фунтов, или каюта первого класса на любом лайнере Имперской почты на выбор победителя.

      Для получения приза необходимо подтвердить участие: пришлите квитанцию о покупке билета и регистрационный сбор в размере пятнадцати фунтов. Если квитанция утеряна — не беда, подтвердите личность описью имущества.

      Ждём ответа в течение трёх суток, после чего выигрыш будет передан резервному участнику. Не упустите судьбу!

  - key: insert-chain-letter
    title: Письмо счастья
    category: mail-inserts
    relatedArticles: []
    body: |
      ## ПИСЬМО СЧАСТЬЯ — ПРОЧТИТЕ ДО КОНЦА, НЕ СВОРАЧИВАЙТЕ

      Это письмо обошло уже сорок два корабля. Его передали капитану «Герцога», который выиграл спор у целой станции, капитану «Пилигрима», который нашел золото в грузовом трюме, и жене смотрителя доков, которая разбогатела не выходя из дома.

      Дело простое: перешлите это письмо десяти капитанам в течение суток — и счастье найдёт Вас само. Пропустите — и три года ходов подряд будет зашторивать корпус, а рационы будут оскоминой.

      Не мешайте счастью. Скопируйте письмо, передайте дальше, не изменяя ни слова. Десять адресатов — и Вы в числе избранных.

      *Приложение к делу № 1140/14: адресаты не просматривались, узел не проверял.*
