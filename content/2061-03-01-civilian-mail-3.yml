  - key: inspection-note-march
    title: Служебная запись № 1140/19 — ложные служебные отправления
    category: mail-inserts
    relatedArticles:
      - phish-bank
      - phish-admiralty
      - phish-tech-support
    body: |
      ## СЛУЖЕБНАЯ ЗАПИСЬ № 1140/19

      **Составил:** инспектор гражданской почты Э. Марш
      **Место:** узел связи «Пересадочная», гражданский сектор
      **Основание:** досмотр отправлений первой декады марта 2061 года.

      При досмотре выявлены отправления иного рода, нежели вкладыши прежних партий. Данные письма имитируют служебную переписку ведомств: банков, канцелярий, служб узла. Составители добиваются от получателя служебных кодов, кодовых слов и сведений о передвижении судов.

      Инспекция квалифицирует это не как коммерцию, а как покушение на служебную тайну. Дело передано в контрразведку. Экипажам судов, получившим подобные отправления, — немедленно докладывать коменданту узла, ничего не отвечая.

      **Приложения:** три отправления (см. связанные материалы).

  - key: phish-bank
    title: Уведомление Имперского банка (копия)
    category: mail-inserts
    relatedArticles: []
    body: |
      ## ИМПЕРСКИЙ БАНК — СЛУЖБА БЕЗОПАСНОСТИ СЧЕТОВ

      Уважаемый клиент!

      Ваш счёт приостановлен по подозрению в несанкционированном доступе. Для возобновления работы счёта пройдите по защищённому каналу и введите: полное имя, дату рождения, кодовое слово счёта и последние три операции.

      Канал остаётся открытым в течение суток. По истечении срока счёт будет передан в ликвидационную канцелярию, а средства — в доход казны.

      С уважением,
      Служба безопасности счетов Имперского банка
      *Пересылается через открытые сети узла связи. Бланк без печати.*

  - key: phish-admiralty
    title: Срочное донесение Адмиралтейства (копия)
    category: mail-inserts
    relatedArticles: []
    body: |
      ## АДМИРАЛТЕЙСТВО — КАНЦЕЛЯРИЯ ПРОЕКТА ИКАР

      СРОЧНО. СЛУЖЕБНОЕ.

      Командирам кораблей эскорта проэкта ИКАР!

      В связи с учениями требуется подтверждение актуальности переходных кодов Вашего судна. Ответьте немедленно по этому же каналу: номер судна, действующий переходный код, место стоянки и дата следующего выхода.

      Ответ обязателен в течение шести часов. За уклонение — дисциплинарное разбирательство и удержание жалованья.

      Начальник канцелярии,
      лейтенант-коммандер В. Порчи
      *Приложено: подпись оттиском, бланк без герба, две орфографические ошибки.*

  - key: phish-tech-support
    title: Уведомление службы узла связи (копия)
    category: mail-inserts
    relatedArticles: []
    body: |
      ## СЛУЖБА ТЕХНИЧЕСКОГО НАБЛЮДЕНИЯ УЗЛА СВЯЗИ «ПЕРЕСАДОЧНАЯ»

      Вниманию владельца терминала!

      Наши наблюдатели зафиксировали подозрительную активность Вашего терминала: исходящие запросы в неизвестные сектора. Для проверки целостности Вашей линии сообщите дежурному инженеру кодовое слово терминала и сегодняшний контрольный знак сеанса.

      Проверка занимает минуту и не требует Вашего присутствия. Отказ от проверки расценивается как сокрытие нарушения, линия будет отключена от узла без права пересмотра.

      Дежурный инженер ждёт ответа по этому каналу круглосуточно.

      *Примечание инспекции: службы технического наблюдения с таким названием на узле не числится.*
