      ## ИМПЕРСКАЯ ПОЧТА — СТАНЦИЯ ДАЛЬНЕГО МЕТРИЧЕСКОГО ЯКОРЯ
      ### Почтовое отделение, контейнерная секция

      **Контейнер:** № ДЯ-118/61
      **Получатель:** командование HMS Peregrine, для вручения по бортовому списку
      **Вскрытие в пути:** не производилось
      **Повреждений:** не выявлено

      Отправления приняты в гражданской сети в последней декаде февраля 2061 года, доставлены до станции почтовым пакетом «Курьер-Дальний» 04.03.2061. Передано на борт 05.03.2061, расписка командования получена.

      |№|Получатель|Отправитель|Дата отправления|Вложения|
      |---|---|---|---|---|
      |1|лейтенант-коммандер В. Перси|адмирал лорд Перси|24.02.2061|фотокарточка «семейный очаг», платок|
      |2|лейтенант К. МакГлоклин|Клара МакГлоклин, Ирландия|22.02.2061|семейная фотокарточка, банка варенья|
      |3|лейтенант Т. Джонсон|профессор К. Ламар, Доминион Техас|25.02.2061|фотокарточка с семейного собрания|
      |4|мл. лейтенант Г. Кроушей|леди Фиона Кроушей|23.02.2061|фотокарточка|
      |5|лейтенант А. Бишоп|отец Бенедикт Унпаса, Момбаса|26.02.2061|крестик на шнурке (дерево)|

      **Почтмейстер станции:** Э. Уэллсли

  - key: letter-percy
    title: Письмо адмирала лорда Перси — дочери
    category: personal-mail
    relatedArticles: []
    body: |
      ## АДМИРАЛ ЛОРД ПЕРСИ — ДОЧЕРИ

      **Кому:** Виктории
      **Дата:** 24 февраля 2061 г.
      **Место:** поместье Перси, Нортумберленд

      Виктория.

      Письмо твоё от десятого получил. Форма у него правильная: краткая, без слов, которых в ней быть не должно. Надеюсь, это ты научилась у меня, а не у службы — служба такому не учит, служба требует.

      О месте и сроке твоего назначения спрашивать не стану. Мне доводилось держать в руках запечатанные приказы, и я знаю, каково это — читать в глазах близких вопросы, на которые нельзя отвечать. Запомни одно: я не жду от тебя писем, которые ты не имеешь права написать.

      Ты не раз говорила мне, зачем ты служишь. С расчётом я не согласен, а вот с тем, как ты его выполняешь, — согласен всегда. Экспедициям такого рода прощается ровно одна ошибка, и эта ошибка — люди. Возвращай корабль домой. Остальное решит время.

      Мать вложила платок. Её слова: «на краю света холоднее, чем в Академии». К её сведению: в Академии тоже бывает холодно. Она плакала в столовой вечером перед твоим отъездом и просила меня тебе не говорить. Считай, что я не сказал.

      Твой отец,
      А. Перси, адмирал

  - key: letter-mcglocklin
    title: Письмо Клары МакГлоклин — сыну
    category: personal-mail
    relatedArticles: []
    body: |
      ## КЛАРА МАКГЛОКЛИН — СЫНУ

      **Кому:** Коллину
      **Дата:** 22 февраля 2061 г.
      **Место:** ферма Килленард, Ирландия

      Коллин, дорогой.

      Пишу за весь дом, пока всех не разогнали по делам. Семя для весеннего сева привезли в срок. Трактор «Дейзи» держится: твой ремонт семилетней давности до сих пор стоит, хотя отец говорит, что ты тогда поставил деталь «на вырост». Отец чинит крышу амбара и ворчит, что теперь у него для этого есть время — вся молодёжь разлетелась.

      Ты написал нам: «далеко и надолго». Больше нам и не надо. Твой дед уходил в своё небо с теми же словами, и дома ему после этого тоже вопросов не задавали.

      Приписки — по очереди, как все к телефону:

      — Мэкки: вставай там по утрам. Я серьёзно.
      — Ричард: Мэкки вставал так дважды за год.
      — Брайан: если увидишь звезду, которая ещё ничья, — передай ей привет от нас.
      — Нил: привези камень. Какой угодно. С того края.
      — Саманта: учу Френсис вязать. К твоему возвращению свяжем шарф, который ты не будешь носить. Мы знаем. Свяжем всё равно.
      — Френсис: Саманта врёт, вяжу я лучше.

      Дедовы медали лежат в прежнем ящике. Ты после Академии так и не заглянул в него — загляни, когда вернёшься. В семейном альбоме за тобой теперь целая страница.

      Банка варенья — малина прошлого лета. Фотокарточку снимали у «Дейзи», влезли все, кроме собаки.

      Береги себя. Молимся по воскресеньям.

      Мать.

  - key: letter-lamar
    title: Письмо профессора Констанции Ламар — внуку
    category: personal-mail
    relatedArticles: []
    body: |
      ## ПРОФЕССОР К. ЛАМАР — ВНУКУ

      **Кому:** Тайлеру
      **Дата:** 25 февраля 2061 г.
      **Место:** Остин, Доминион Техас

      Тайлер.

      Письмо твоё получила. «Дальняя служба на окраине системы» — формулировку записала. За годы твоей службы я записала немало формулировок, и все они были длиннее расстояния, которое ты на самом деле проходил. Оставим географию. География — единственный предмет, где тебе когда-то ставили «удовлетворительно», и то из милости к твоей бабушке.

      Ты пишешь «окраина системы». Я провела жизнь у окраин, Тайлер. Они всегда оказываются дальше, чем написано в приказе. Об этом больше ни слова — почта есть почта, а старушки умеют молчать лучше адмиралов.

      В ноябре поставим твою тарелку. Мать уже поспорила с поваром, помнит ли он, как ты устраиваешь скандал из-за гречневой каши. Скандал будет заочным, но торжественным.

      Что до слухов о каком-то соревновании, целью которого, якобы, является моё удовлетворение, — ничего о нём не знаю. Старушки вообще мало что знают. Мы только стараемся, чтобы вам было что выигрывать.

      Вложена фотокарточка с прошлого собрания. Смотри на нас и не грусти. Старая дама на переднем плане держит спину, потому что знает: на неё смотрят.

      Побеждай там, где молчат.

      Твоя бабушка, не имеющая сведений ни о каких соревнованиях,
      К. Ламар, баронесса

  - key: letter-crowshay
    title: Письмо леди Фионы Кроушей — дочери
    category: personal-mail
    relatedArticles: []
    body: |
      ## ЛЕДИ ФИОНА КРОУШЕЙ — ДОЧЕРИ

      **Кому:** Гвендолин
      **Дата:** 23 февраля 2061 г.
      **Место:** поместье Кроушей

      Гвендолин, моя дорогая.

      Письмо твоё прочла дважды. Один раз — глазами, другой — уже как мать, которая ищет, не написала ли ты чего лишнего. Ты не написала. Ты всегда умела хранить чужое, и я горжусь этим больше, чем умею сказать.

      Освальд пишет со станции: у него новая карта сектора, и он счастлив, как мальчишка. Никандр молчит третий месяц — это у него значит, что всё хорошо. Орион прислал снимки раскопок, старые кости, он в восторге. Я устала его понимать.

      Джулиан рядом с тобой. Я не стану притворяться, что понимаю, как это устроено. Спрашивать, каково тебе, тоже не стану. Только одно: в детстве он обыгрывал тебя в шахматы и делал вид, что это случайность. Проверь, умеет ли он так же до сих пор.

      Отец просил передать, что горд. Сам писать не стал — сказал, что всё важное уже сказал тебе при прощании. Ты знаешь его. Я скажу за себя: Гамильтоны поколениями ходили в дальние места, и теперь ты идёшь дальше всех нас. Пусть отец называет это иначе — для меня это просто правда.

      Фотокарточку вложила: ты и Джулиан за доской, Рождество пятьдесят седьмого. Ты тогда дулась над ферзём.

      Пиши, когда будет почта. А почты нет — пиши всё равно, датами. Я буду знать, что ты жива, по самому факту бумаги.

      Твоя мать,
      Фиона

      P.S. Чай пей. Не тот, что в пайке.

  - key: letter-bishop
    title: Письмо отца Бенедикта Унпаса — сыну
    category: personal-mail
    relatedArticles: []
    body: |
      ## ОТЕЦ БЕНЕДИКТ УНПАСА — СЫНУ

      **Кому:** Адаму
      **Дата:** 26 февраля 2061 г.
      **Место:** Англиканская церковь Святого Уильяма, Момбаса

      Адам, сын мой.

      Письмо твоё получил и прочёл приходу после вечерней службы. Люди обрадовались. Все спрашивали, когда ты вернёшься, и я ответил честно: через пять лет. Для церкви пять лет — срок короткий. Для матери, которая когда-то кормила тебя из соски, — я знаю, длинный. Так устроен наш род человеческий.

      Крыша починена. Деньги собрали за два воскресенья, прихожане спорили, кто даст больше, словно крыша — это базар. Команда мальчишек заняла второе место в окружном турнире по крикету. Руфус поймал мяч, который летел совсем в другую сторону, и с тех пор не снимает твою старую перчатку.

      И ещё одна весть, ради которой я и пишу не днём, а поздно вечером. У нашей двери, как и тридцать два года назад, нашли младенца. Девочка. Назвали её Тимна — «завтра». Ты понимаешь, почему я пишу об этом именно тебе.

      Идёшь ты за край карт, сын мой, но не за край Божьего промысла. Пять лет — это молитва с паузами. Молись, как умеешь, и приходи домой.

      Крестик вложил. Вырезал Руфус из оливкового дерева, того, что растёт у старой школы. Крестик мал, а молитва, как ты знаешь, в размере не измеряется.

      Благословляю тебя. Боже, храни Короля.

      Твой отец в Господе,
      Бенедикт Унпаса, приход Святого Уильяма
