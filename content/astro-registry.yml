    title: Система Сол
    relatedArticles: []
    body: |
      ## I. СИСТЕМА СОЛ

      **Каталожное обозначение:** SOL  
      **Центральная звезда:** Солнце, звезда спектрального класса G2 V  
      **Статус на 2061 год:** колыбель человечества; столица и основная промышленная база Британской империи; место зарождения переходной технологии  
      **Главный политический центр:** Земля  
      **Основные населённые и промышленные зоны:** Земля, Луна, Марс, орбитальные поселения, Пояс астероидов, исследовательские и промышленные объекты внешней Солнечной системы.

      ### I.1. Политическое устройство

      К 2061 году Британская империя представляет собой систему земель Короны, доминионов, протекторатов, зависимых монархий и автономных владений. Лондон остаётся главным центром политической легитимности, внешней политики и военно-космического командования. Внутреннее управление обширными территориями осуществляется местными администрациями и аристократическими элитами. Наличие выборных органов в отдельных владениях не отменяет верховенства Короны.

      В Солнечной системе имперское превосходство не равнозначно полному политическому единству. **Марс** существует как самостоятельный промышленный и политический центр, возникший в результате переселения сил, стремившихся выйти из-под британского контроля. Способ, которым марсианские поселения преодолели зависимость от земных запасов Галлеита, остаётся закрытым стратегическим вопросом.

      ### I.2. Основные этапы космического освоения

      | Год или период | Событие и значение |
      |---|---|
      | **1970** | Антарктическая экспедиция обнаруживает вещества, позднее объединённые под названием **экзофазы**. |
      | **1971–1976** | Исследование **Галлеита** приводит к появлению галлионных лучевых систем и полевых экранов. |
      | **1978** | На Первой космической станции испытывается устойчивый **кельвиевый реактор**. Начало Кельвиевой эпохи. |
      | **1989** | На Луне открывают **Кеплерит**. Контакт с кислородсодержащей средой приводит к катастрофе в исследовательском комплексе. |
      | **1993** | Освоен промышленный синтез Кельвия при обработке Кеплерита галлионным потоком. |
      | **1995–2015** | Развиваются лунные поселения, орбитальные верфи и дальние межпланетные экспедиции. Происходит Марсианский исход. |
      | **2015–2040** | Формируется постоянная промышленная и исследовательская инфраструктура Солнечной системы; Марс закрепляет самостоятельность. |
      | **2041** | Юпитерианский инцидент: взаимодействие поля Вейна с импульсным реактором Эшдаун вызывает первый непреднамеренный пространственный переход. |
      | **2041–2048** | Создаются **метрический якорь**, **переходный реактор** и основные правила переходной оболочки. |
      | **2048–2060** | Переходные маршруты сокращают сроки перемещения внутри Солнечной системы. Развивается физическая курьерская передача данных. |
      | **2061** | Подготовлен проект **ICARUS** — первая попытка свободного межзвёздного перехода. |

      ### I.3. Экономическая география накануне ICARUS

      **Земля** остаётся основным источником природного Галлеита и главным политико-финансовым центром Империи. Здесь сосредоточены старые университеты, ведомства, промышленный капитал и значительная часть населения человечества.

      **Луна** — важнейший источник Кеплерита и площадка для переработки экзофаз и производства Кельвия. Лунные комплексы особенно важны для тяжёлой энергетики и строительства.

      **Марс** — независимый индустриальный центр, способный поддерживать собственную космическую программу. Его политические отношения с Империей напряжены, но не сводятся к непрерывной войне.

      **Пояс астероидов и внешние объекты** снабжают кораблестроение и промышленность минеральным сырьём; здесь размещаются исследовательские комплексы и удалённые станции.

      ### I.4. Транспорт и связь

      Штатный перелёт внутри Солнечной системы состоит из обычного движения до области низких гравитационных возмущений, взаимодействия переходного реактора корабля с метрическим якорем, перехода и последующего обычного полёта к пункту назначения. Чем выше требуемый порядок перехода и больше переходная оболочка, тем значительнее энергетическая нагрузка.

      Быстрее света перемещаются **корабли и физические носители информации**. Передавать самостоятельный радиосигнал быстрее света человечество не умеет. Для быстрых распоряжений, почты и разведывательных данных используются курьерские суда.

      Для программы ICARUS за пределами обычной сети сооружён **самый удалённый метрический якорь Солнечной системы своего времени**. Его точное положение, штатная пропускная способность и служебное обозначение подлежат уточнению в отдельном реестре.
  - key: astro-lhs-1140
    category: astro-registry
    title: Система LHS 1140
    relatedArticles: []
    body: |
      ## II. СИСТЕМА LHS 1140

      **Каталожное обозначение:** LHS 1140 / GJ 3053  
      **Созвездие по земному небу:** Кит  
      **Тип звезды:** красный карлик спектрального класса M  
      **Расстояние от Солнца:** приблизительно **48,9 светового года** (около 14,99 парсека)  
      **Прямое восхождение:** примерно **00 ч 44 м 59,7 с**  
      **Склонение:** примерно **−15° 16′ 27″**  
      **Известные крупные объекты интереса:** планеты **LHS 1140 b** и **LHS 1140 c**  
      **Состояние разведки на 2061 год:** дистанционные наблюдения; пилотируемое прибытие отсутствует.

      ### II.1. Планета LHS 1140 b

      LHS 1140 b обращается вокруг маломассивной звезды примерно за **24,7 земных суток**. Её радиус составляет около **1,7 радиуса Земли**, масса — порядка **5–6 земных масс**. Расчётная поверхностная гравитация близка к **двум земным**.

      Планета находится в области, где при определённых атмосферных условиях возможно существование жидкой воды. Современные астрономические наблюдения допускают, что значительная доля её массы может приходиться на воду и лёд. Это **не** означает подтверждённых океанов на поверхности, пригодной атмосферы или условий, позволяющих человеку жить без технической защиты.

      В рамках имперской программы астрономы к середине XXI века получили более подробные спектральные данные. **Рабочая реконструкция для сеттинга:** в 2050-х годах научный совет трактовал их как убедительное указание на обширные водные запасы и возможное существование азотсодержащей атмосферы. Никаких свидетельств пригодности воздуха для дыхания получено не было.

      ### II.2. Причины выбора направления

      LHS 1140 — далеко не ближайшая к Солнцу звёздная система. Её выбор объясняется не транспортной выгодой, а оценкой **вероятности существования крупного водного мира**.

      В научных записках программы ICARUS предполагалось, что наличие значительных запасов воды может облегчить создание автономного поселения, производство кислорода, организацию сельского хозяйства в закрытых комплексах и длительное содержание колонии.

      Реальный состав атмосферы, геология, доступность воды и пригодность поверхности для индустриального освоения оставались предметом гипотез. Авторы проекта приняли сознательный риск: **дорогой прыжок к наиболее многообещающей цели вместо более дешёвой разведки близких систем**.

      ### II.3. Стратегические ограничения

      Расстояние почти в 49 световых лет требовало перехода высокого порядка и создания специальной инфраструктуры в системе Сол. Отсутствие якоря в системе назначения исключало привычный безопасный якорный маршрут.

      Первая экспедиция должна была прибыть по расчётной гравитационной траектории звезды и самостоятельно создать местную опорную инфраструктуру. До развёртывания нового якоря постоянного транспортного сообщения с Солнечной системой не существовало.

      ### II.4. Данные, отсутствующие на момент отбытия

      До фактической экспедиционной разведки было невозможно достоверно установить:

      - толщину и состав атмосферы LHS 1140 b;
      - степень доступности воды и наличие поверхностного океана;
      - пригодность местной поверхности к строительству и посадке;
      - промышленную ценность малых тел и других планет;
      - реальную стоимость обеспечения постоянного поселения;
      - возможность создания окупаемого транспортного маршрута.

      Следовательно, выражение «перспективная обитаемая система» в документах 2061 года следует понимать как **прогноз**, а не как подтверждённый факт.

