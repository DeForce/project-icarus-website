    title: "История стрелкового оружия Британской империи"
    relatedArticles: []
    body: |
      ## История стрелкового оружия Британской империи

      #### XIX век — 2061 год

      ### 1842–1901 — Развитие Имперской оружейной промышленности

      Расширение Британской империи во второй половине XIX века сопровождалось ростом потребности в стрелковом оружии.

      Увеличение численности вооружённых сил и появление новых доминионов потребовали стандартизации вооружения. Военное ведомство постепенно вводило единые требования к боеприпасам и обслуживанию оружия.

      Одним из главных центров разработки пехотного вооружения стала **Королевская оружейная фабрика в Энфилде** (_Royal Small Arms Factory, Enfield_).

      Предприятие занималось производством штатного армейского оружия и совершенствованием существующих конструкций. В конце XIX века значительная часть его работы была связана с магазинными винтовками.

      Частные производители также сохраняли важное положение.

      **Webley & Scott** специализировалась на револьверах и другом короткоствольном оружии. Её продукция получила широкое распространение среди офицеров и сотрудников полиции.

      **Birmingham Small Arms (BSA)** выпускала стрелковое оружие для военных заказчиков, а также гражданского рынка.

      По мере расширения Империи британские образцы постепенно становились стандартом вооружения местных администраций.

      Доминионы сохраняли право на собственные закупки, однако поставки британского оружия давали преимущества в снабжении и ремонте.

      К началу XX века оружейная промышленность Империи располагала крупной производственной базой и устойчивой системой государственных заказов.

      ---

      ### 1901–1950 — Автоматизация стрелкового оружия

      В первой половине XX века основное внимание оружейных предприятий сосредоточилось на повышении скорострельности пехотного вооружения.

      Магазинные винтовки постепенно уступали место самозарядным системам. Вооружённые силы также расширяли использование ручных пулемётов.

      Развитие автоматического оружия сопровождалось изменением тактики пехотных подразделений.

      Солдат получал возможность вести интенсивный огонь без постоянной ручной перезарядки. При этом увеличивались требования к снабжению боеприпасами.

      Королевская оружейная фабрика продолжала разработку штатных винтовок. BSA стала одним из важных производителей автоматического оружия.

      Отдельное направление занимало оружие для экипажей боевых машин и подразделений охраны.

      Полноразмерные пехотные винтовки были неудобны в тесных помещениях. Это способствовало развитию компактных автоматических образцов.

      Во второй половине этого периода компания **Sterling Armaments** начала занимать заметное положение в производстве пистолетов-пулемётов.

      К середине века основными требованиями к военному оружию стали надёжность и простота массового производства.

      Эти требования сохранят значение на протяжении следующего столетия.

      ---

      ### 1950–1970 — Стандартизация вооружения

      Послевоенное развитие британской промышленности позволило совершенствовать производство стрелкового оружия.

      Широкое распространение получили штампованные металлические детали и синтетические материалы.

      Полимерные накладки постепенно заменяли деревянные элементы на штатных военных образцах. Дерево продолжали использовать при производстве охотничьего и дорогого офицерского оружия.

      В конструкции автоматических винтовок всё больше внимания уделялось удобству обслуживания.

      Оружейные предприятия разрабатывали компактные модели и испытывали новые схемы размещения механизмов.

      Развитие оптической промышленности позволило оснащать пехотное оружие более совершенными прицелами.

      Электронные устройства также применялись, однако их стоимость и размеры ограничивали распространение. На большинстве серийных образцов сохранялись механические прицельные приспособления.

      К концу 1960-х годов Империя располагала развитой системой стрелкового вооружения, которая удовлетворяла основные потребности армии и полиции.

      ---

      ### 1970–1990 — Галлеит и пересмотр военной доктрины

      Открытие Галлеита в 1970 году привело к появлению новых направлений военных исследований.

      Галлионные лучи обладали высокой разрушительной мощностью. Полевые экраны обеспечивали эффективную защиту от многих видов кинетического вооружения.

      Первоначально военное руководство рассматривало возможность широкого внедрения этих технологий.

      Однако первые испытания выявили серьёзные ограничения.

      Галлионные установки требовали значительных энергетических мощностей. Даже относительно небольшие образцы нуждались в оборудовании, размеры которого исключали применение обычным пехотинцем.

      Полевые экраны имели аналогичную проблему.

      В результате новые технологии получили распространение прежде всего на крупных военных объектах. Развитие галлионного вооружения постепенно сосредоточилось в тяжёлой промышленности, где значительную роль играла Vickers-Armstrongs.

      Для пехоты основным оружием оставались пороховые системы.

      Совершенствование бронезащиты способствовало дальнейшей разработке винтовочных боеприпасов. При этом увеличение мощности патронов ограничивалось отдачей и требованиями к массе снаряжения.

      Принятая в этот период военная доктрина закрепила разделение между тяжёлым лучевым вооружением и личным огнестрельным оружием.

      ---

      ### 1990–2020 — Оружие космической эпохи

      Развитие кельвиевой энергетики и строительство постоянных орбитальных объектов поставили перед военным ведомством новые задачи.

      Для охраны космических станций требовалось стрелковое оружие, пригодное к эксплуатации в герметичных помещениях.

      Обычные пороховые патроны сохраняли работоспособность в вакууме. Однако условия космической службы предъявляли особые требования к конструкции оружия.

      Инженеры пересмотрели применяемые смазочные материалы и способы защиты механизмов от перепадов температуры.

      На флотских образцах появились увеличенные органы управления, рассчитанные на использование в перчатках скафандра.

      Отдельную проблему представляла стрельба внутри корабля.

      Повреждение трубопроводов или энергетического оборудования могло привести к серьёзной аварии. Поэтому Адмиралтейство поручило разработать специализированные боеприпасы с ограниченной пробивной способностью.

      Они предназначались преимущественно для корабельной охраны и абордажных операций.

      Новые патроны снижали вероятность повреждения конструкций, однако сохраняли опасность при попадании в оборудование.

      Применение оружия внутри герметичных отсеков стало предметом отдельной подготовки военнослужащих.

      **Sterling Armaments** получила значительную часть флотских заказов на компактное автоматическое оружие.

      Королевская оружейная фабрика продолжала разработку винтовок и карабинов для наземных подразделений.

      ---

      ### 2020–2040 — Формирование космических пехотных подразделений

      Расширение постоянного присутствия Империи в Солнечной системе сопровождалось созданием специализированных подразделений космической пехоты.

      Их задачи включали охрану орбитальных сооружений и проведение десантных операций.

      Вооружение таких подразделений разрабатывалось с учётом эксплуатации в скафандрах.

      Особое внимание уделялось компактности.

      При действиях в условиях низкой гравитации отдача оружия могла нарушать устойчивость стрелка. Поэтому военнослужащих обучали использованию внешних опор и креплений скафандра.

      Развивались специальные модели карабинов с улучшенными средствами фиксации.

      Обычная армейская винтовка при этом сохраняла преимущество при наземных действиях.

      Постепенно сформировались два основных направления военного стрелкового вооружения: универсальное армейское и специализированное флотское.

      Производители стремились сохранить общие принципы обслуживания и совместимость боеприпасов там, где это было возможно.

      ---

      ### 2040–2061 — Вооружение Эры Перехода

      Открытие перехода Вейна—Эшдаун значительно ускорило развитие Имперского космического флота.

      Появление новых транспортных маршрутов увеличило потребность в корабельной охране. Вооружённые силы также расширили подготовку к абордажным действиям.

      При этом развитие переходной технологии практически не изменило устройство персонального оружия.

      Компактные галлионные генераторы по-прежнему требовали слишком больших энергетических установок.

      Полевые экраны оставались частью защиты крупных объектов и кораблей.

      Основным личным вооружением военнослужащих продолжали служить пороховые винтовки и пистолеты.

      К началу 2060-х годов основу штатного вооружения составляют следующие образцы.

      #### Enfield L58A2

      Стандартная самозарядная винтовка Имперских сухопутных войск.

      Разработана Королевской оружейной фабрикой в Энфилде. Отличается простой конструкцией и высокой ремонтопригодностью.

      Используется в большинстве регулярных пехотных подразделений. Для специализированных частей выпускаются отдельные варианты.

      #### Sterling L64A1

      Компактный автоматический карабин Имперского флота.

      Предназначен для корабельной охраны и действий в ограниченном пространстве.

      Конструкция допускает использование в вакууме. Органы управления приспособлены для работы в перчатках.

      Карабин получил широкое распространение среди экипажей военных кораблей.

      #### Webley & Scott P.52

      Штатный самозарядный пистолет офицеров Имперского флота.

      Отличается преимущественно металлической конструкцией. Серийные модели имеют простую отделку, рассчитанную на длительную эксплуатацию.

      Пистолет используется также офицерами наземных сил.

      #### BSA L41

      Лёгкий пулемёт для поддержки пехотных подразделений.

      Выпускается в нескольких исполнениях, предназначенных для разных условий службы.

      Основная область применения — наземные операции.

      ---

      ### Офицерское оружие и традиции

      Особое положение в вооружённых силах Империи занимает личное оружие офицеров.

      После окончания военной академии офицер получает штатный служебный пистолет.

      В отличие от большинства предметов военного имущества, личное оружие часто сопровождает офицера на протяжении значительной части службы.

      В отдельных подразделениях сохраняется традиция приобретения собственного пистолета.

      Такое оружие допускается к службе после прохождения установленной сертификации.

      Состоятельные офицеры нередко заказывают изделия с индивидуальной отделкой.

      Оружейные мастерские используют воронёную сталь и деревянные накладки. На дорогих экземплярах встречаются гравированные инициалы владельца или фамильный герб.

      Компании Webley & Scott и некоторые частные мастерские продолжают обслуживать этот рынок.

      Отдельное место занимает **Holland & Holland**, специализирующаяся на дорогом охотничьем оружии.

      Её продукция пользуется спросом среди Имперской аристократии. Особенно распространены подобные изделия в охотничьих хозяйствах старых доминионов.

      Таким образом, в одной воинской части могут одновременно использоваться стандартные серийные пистолеты и дорогое личное оружие офицеров.

      Различия в отделке отражают традиции происхождения и имущественное положение владельца.

      ---

      ### Гражданское оружие

      Оборот огнестрельного оружия регулируется законодательством доминионов в пределах общих имперских требований.

      В густонаселённых центральных территориях действует система лицензирования.

      Продажа автоматического оружия частным лицам ограничена. Гражданские винтовки и охотничьи ружья остаются доступными при соблюдении местных правил.

      В промышленных районах и сельских доминионах распространённость оружия выше.

      Значительную часть гражданского рынка занимают охотничьи изделия BSA и частных британских мастерских.

      Местные производители также выпускают оружие, ориентированное на потребности собственных территорий.

      Имперское правительство сохраняет контроль над экспортом военных образцов и поставками в стратегически важные районы.

      ---

      ### Стрелковое оружие к началу Проекта «Икар»

      К 2061 году личное вооружение Империи представляет собой результат длительного развития пороховых систем.

      Штатные военные образцы изготавливаются преимущественно из стали и современных полимерных материалов.

      Прицелы чаще всего оптические или механические. Наиболее сложное дополнительное оборудование встречается у специализированных подразделений.

      Военные предприятия продолжают использовать традиционную систему обозначений моделей и модификаций.

      Для государственных заказчиков важное значение имеют надёжность и совместимость с существующей системой снабжения.

      На этом фоне сохраняется отдельная культура дорогого офицерского оружия, в котором современные механизмы сочетаются с традиционной отделкой.

      Для флота и сухопутных войск установлены разные требования к личному вооружению. Однако общая техническая основа остаётся единой.

      **К моменту запуска Проекта «Икар» огнестрельное оружие продолжает составлять основу индивидуального вооружения Имперских вооружённых сил.** Галлионные технологии применяются преимущественно в тяжёлых военных системах, а дальнейшее развитие персонального оружия связано с совершенствованием существующих пороховых конструкций.
