    body: |
      ## Общая История
      ### 1774–1783 — Американское урегулирование

      Историки Империи считают события 1774 года одним из ключевых политических переломов современной истории.

      К этому времени отношения между британской Короной и североамериканскими колониями резко ухудшились. Основными причинами стали налоги и вопрос политического представительства. В колониях росла поддержка открытого сопротивления.

      Лондон изменил курс раньше, чем конфликт перерос в полномасштабную войну.

      Корона отменила часть наиболее спорных законов и расширила полномочия колониальных собраний. Влиятельным семьям предложили более прямое участие в управлении территориями.

      Эти уступки раскололи сторонников независимости. Умеренные согласились продолжить переговоры с Лондоном, а радикальные группы лишились значительной части поддержки.

      Вооружённые столкновения всё же происходили, однако британские власти смогли подавить отдельные восстания до формирования единого революционного движения.

      В последующие годы североамериканские колонии постепенно получили широкую внутреннюю автономию. Из этой системы позднее выросли первые крупные **Доминионы Короны**.

      Доминионы получали собственные собрания и администрации. Внешняя политика и оборона оставались в ведении Короны.

      Успех Американского урегулирования сильно повлиял на дальнейшее устройство Империи. Британское правительство пришло к выводу, что устойчивое управление требует участия местных элит.

      ---

      ### 1783–1839 — Империя компромисса

      Сохранение Северной Америки внутри британской системы изменило политическое развитие Атлантики.

      Республиканские идеи продолжали распространяться по Европе. В разных странах происходили восстания и политические кризисы.

      Британские политики всё чаще ссылались на Американское урегулирование как на пример того, что расширение автономии может сдерживать революционные движения.

      Сама Британия также постепенно менялась.

      Корона начала использовать аристократию как инструмент интеграции новых элит. Высокие титулы оставались наследственными, однако рыцарство и младшие титулы всё чаще получали люди, добившиеся заметных результатов на службе Империи.

      Военные получали награды за кампании. Промышленники могли войти в привилегированное сословие после создания предприятий стратегического значения.

      Такая же практика постепенно распространилась на колонии.

      Местные правители и богатые семьи могли получить место в Имперской системе при условии лояльности Короне.

      Из этого сформировался один из основных политических принципов Британии:

      **способного противника выгоднее включить в систему власти.**

      Одновременно сохранялись выборные муниципальные органы и профессиональные объединения. Они решали большую часть местных вопросов.

      Верховная власть оставалась за Короной.

      ---

      ### 1839–1842 — Первая Китайская война

      В 1839 году началась война между Великобританией и Империей Цин.

      В официальных британских источниках позднее закрепилось название **Первая Китайская война**. За пределами Империи продолжали использовать название **Опиумная война**.

      Британская победа оказалась значительно более полной, чем ожидалось в начале кампании.

      Лондон получил контроль над рядом портов и важнейшими торговыми маршрутами. Британские представители также получили доступ к китайской административной системе.

      После войны Британия начала выстраивать в Восточной Азии новый тип политической зависимости.

      Китайские чиновники сохраняли управление внутренними территориями. Британское влияние концентрировалось на торговле и внешней политике.

      Королевский флот обеспечивал безопасность морских путей.

      Эта модель стала основой будущего **Имперского протектората**.

      Протекторат позволял местному государству сохранять собственное устройство. В обмен его правительство признавало британское верховенство в стратегических вопросах.

      ---

      ### 1842–1901 — Век Имперского расширения

      Победа в Китае сильно повлияла на британскую внешнюю политику.

      Лондон всё реже стремился к прямому присоединению новых территорий. Вместо этого использовались договоры и военное давление. Отдельную роль играло сотрудничество с местными элитами.

      Во второй половине XIX века серия европейских конфликтов постепенно усилила положение Британии.

      Часть европейских монархий признала британское верховенство в обмен на сохранение внутренней автономии.

      Другие продолжили сопротивление.

      Французская Корона постепенно перенесла значительную часть двора и капитала в заморские владения. Похожим образом поступила испанская монархия.

      Южная Америка стала главным центром европейских государств, отказавшихся войти в британскую систему.

      Некоторые независимые территории сохранились в Африке.

      Лондон в большинстве случаев терпел их существование. Эти государства принимали эмигрантов и политических противников Империи.

      Конфликты возникали, когда их правительства начинали угрожать британской торговле или поддерживать вооружённые движения внутри Империи.

      В таких случаях Британия применяла экономическое давление или проводила ограниченную военную кампанию.

      ---

      #### Австралия

      Британское присутствие в Австралии долгое время оставалось ограниченным торговыми постами и военно-морскими базами.

      Имперская каторжная система использовала другие территории.

      В XIX веке южнокитайские торговые дома начали основывать на австралийском побережье постоянные поселения. Позднее к ним присоединились переселенцы из прибрежных областей Китая.

      Постепенно на континенте возник самостоятельный центр китайской культуры и торговли.

      Когда британское влияние в самом Китае усилилось, австралийские территории уже обладали собственными администрациями.

      Это позволило им сохранить широкую автономию.

      ---

      ### 1901 год — Имперская система

      К началу XX века около трёх пятых населения и территории Земли находились внутри британской политической системы.

      Прямое управление из Лондона распространялось только на часть этих земель.

      Остальные территории имели различный статус.

      Существовали земли Короны и Доминионы. Наряду с ними действовали протектораты, зависимые монархии и автономные владения.

      Отдельную категорию составляли государства, которые формально сохраняли независимость, но были связаны с Британией договорами.

      Местное законодательство могло сильно различаться.

      Китайский губернатор управлял своей территорией иначе, чем германский герцог. Североамериканский доминион также имел собственную политическую систему.

      Общей основой оставалась присяга Короне и признание Имперской внешней политики.

      ---

      ### 1901–1970 — Долгий Имперский век

      В XX веке британская политическая система постепенно стабилизировалась.

      Выборные органы существовали почти во всех крупных территориях. Их полномочия в основном касались местного управления и экономики.

      Вопросы обороны и внешней политики оставались под контролем Короны.

      Имперская аристократия продолжала расширяться.

      Офицер мог получить рыцарство после успешной службы. Учёные и промышленники также получали титулы за работу, которую правительство считало стратегически важной.

      Местные династии постепенно включались в общую систему привилегий.

      К середине XX века аристократия стала международным правящим сословием.

      Происхождение из старой английской семьи по-прежнему давало высокий статус, однако уже не являлось обязательным условием для политической карьеры.

      ---

      ### Имперская промышленность

      Расширение Империи обеспечило британской промышленности огромный внутренний рынок и постоянный поток государственных заказов.

      Крупные инженерные фирмы постепенно превратились в предприятия стратегического значения.

      Формально большинство из них оставалось частными компаниями. Государство при этом контролировало военные контракты и могло ограничивать передачу технологий.

      Особое положение занимали фирмы, связанные с флотом и энергетикой.

      **Vickers-Armstrongs** оставалась одним из основных производителей вооружения и тяжёлых военных конструкций.

      **Cammell Laird** сохраняла сильные позиции в судостроении и строительстве крупных промышленных объектов.

      Авиационная промышленность развивалась вокруг нескольких старых фирм.

      **Rolls-Royce** стала одним из главных производителей авиационных двигателей и сложных энергетических машин.

      **de Havilland** специализировалась на лёгких скоростных конструкциях.

      **Short Brothers** получила значительную долю рынка тяжёлых транспортных аппаратов и машин для эксплуатации в сложных условиях.

      **Napier** сохраняла собственную школу двигателестроения.

      Компания **Bentley** после перехода под контроль Rolls-Royce сохранила отдельное инженерное подразделение. Оно занималось компактными высокофорсированными установками и дорогостоящими специальными машинами.

      В электротехнической отрасли сходное положение занимали **English Electric** и **Marconi**.

      Первая специализировалась на энергетическом оборудовании и системах управления большой мощностью.

      Marconi стала главным поставщиком дальней связи, радиолокации и военной радиоэлектроники.

      **Ferranti** развивала вычислительные машины и промышленную автоматику.

      Эти компании позднее станут основой космической промышленности Империи.

      ---

      ### Кризис миниатюризации

      В XX веке развитие вычислительной техники столкнулось с серьёзными ограничениями.

      Полупроводниковая электроника развивалась медленно. Кремниевые устройства оставались сложными в производстве, а дальнейшая миниатюризация быстро упиралась в физические пределы материала.

      Электронные вычислительные машины продолжали совершенствоваться, но сохраняли большие размеры и высокую стоимость.

      В промышленности широко использовались аналоговые вычислители и электромеханическая автоматика. Специализированные электронные системы применялись там, где оправдывали собственную стоимость.

      К середине века стало ясно, что дальнейший рост вычислительных возможностей потребует другого подхода.

      Одним из таких направлений стали исследования взаимодействия техники с живой нервной тканью.

      Эти исследования привели к созданию первых **Считателей**.

      Считатель представлял собой биологическую вычислительную систему. В наиболее сложных моделях использовался поддерживаемый в живом состоянии человеческий мозг.

      Обычные машины выполняли точные математические операции.

      Считатели применялись там, где требовалась обработка сложных динамических данных или распознавание плохо формализуемых закономерностей.

      Ferranti стала одним из основных производителей оборудования для работы со Считателями.

      Компания выпускала интерфейсные системы и специализированные вычислительные машины, которые обеспечивали предварительную обработку данных.

      Биологическая часть Считателя производилась отдельными медицинскими и государственными учреждениями.

      Позднее Считатели стали важной частью навигационных систем и крупных исследовательских комплексов.

      ---

      ### 1970 — Антарктическое открытие

      В 1970 году экспедиция Имперского антарктического управления обнаружила в глубоких геологических слоях несколько веществ с необычными физическими свойствами.

      Первые отчёты описывали их как неизвестные химические элементы.

      Дальнейшие исследования показали более сложную картину.

      Часть обнаруженных веществ представляла собой особые состояния уже известной материи. Другие образцы имели свойства, которые плохо соответствовали существующим моделям ядерной физики.

      Для всей группы закрепилось название **экзофазы**.

      Первой экзофазой, получившей практическое применение, стал **Галлеит**.

      ---

      ### 1971 — Акт о стратегической промышленности

      Первые результаты исследований экзофаз убедили правительство в их военном и экономическом значении.

      В 1971 году Парламент принял **Акт о стратегической промышленности**.

      Закон позволял Короне получать контрольные доли предприятий, чьи технологии считались критическими для обороны или энергетики.

      Для координации таких компаний был создан **Imperial Strategic Industries Board**, или **ISIB** — Имперский совет стратегической промышленности.

      Компании сохраняли собственные марки и конструкторские бюро.

      Государство получало право определять доступ к закрытым исследованиям и распределять стратегические заказы.

      Rolls-Royce перешла под прямой контроль Короны и стала основным подрядчиком новых энергетических программ.

      Стратегические подразделения Vickers-Armstrongs также получили особый правовой статус.

      Другие крупные фирмы работали через государственные контракты и совместные исследовательские программы.

      Так возникла система, при которой несколько старых промышленных домов конкурировали внутри общего государственного проекта.

      ---

      ### 1971–1976 — Галлеит

      Галлеит представлял собой сложную кристаллическую структуру с необычными физическими свойствами.

      При подаче большой мощности кристалл начинал испускать короткоживущие заряженные частицы, получившие название **галлионов**.

      Вне кристаллической решётки галлионы существовали недолго. Электромагнитное поле позволяло управлять направлением их движения и формировать устойчивые потоки.

      Сфокусированный поток галлионов стал основой нового класса лучевого оружия.

      При попадании в материальный объект галлионный луч передавал ему значительное количество энергии, вызывая интенсивный нагрев и разрушение поверхности.

      Дальнейшие исследования показали, что распределённое галлионное поле способно формировать устойчивую пространственную мембрану.

      Такая мембрана препятствовала прохождению крупных материальных объектов независимо от скорости их движения.

      При столкновении с экраном снаряды останавливались или отклонялись. В зависимости от энергии удара они могли деформироваться либо разрушаться.

      При этом отдельные нейтральные молекулы газов свободно проходили через мембрану. Мелкодисперсные частицы также могли проникать через поле, если их взаимодействие с галлионной структурой было достаточно слабым.

      Другим важным свойством мембраны стало взаимодействие с ионизирующим излучением.

      Галлионное поле эффективно отклоняло заряженные частицы высокой энергии и ослабляло высокоэнергетическое электромагнитное излучение. Видимый свет и обычные радиосигналы при этом практически свободно проходили через экран.

      Это сделало галлионные поля перспективным средством защиты от космической радиации.

      Для поддержания устойчивой мембраны требовалась система согласованных эмиттеров.

      При столкновении материальных объектов с экраном возникающая нагрузка передавалась на эмиттеры и их крепления. Чрезмерные механические воздействия могли нарушить устойчивость защитного контура.

      Галлионные лучи взаимодействовали с мембраной иначе. Направленный поток вызывал нарушение её внутренней структуры, заставляя генератор расходовать энергию на восстановление поля.

      При достаточно интенсивном воздействии происходил локальный пробой защитной оболочки.

      Таким образом, лучевое оружие оказалось особенно эффективным средством борьбы с галлионными экранами.

      Основным ограничением обеих технологий стало энергопотребление.

      Создание мощного луча и поддержание плотной защитной мембраны требовали крупных энергетических установок.

      Дополнительные ограничения накладывали размеры генераторов и систем охлаждения.

      Поэтому первые практически пригодные комплексы представляли собой дорогостоящие стационарные сооружения.

      Разработки сосредоточились на защите стратегических объектов и создании тяжёлого вооружения.

      Персональные галлионные системы оставались технически недоступными.

      Сухопутные войска продолжали использовать преимущественно огнестрельное оружие.

      ---

      ### Кельвий

      Вместе с Галлеитом в Антарктике обнаружили другую экзофазу.

      Она получила название **Кельвий**.

      По своим свойствам вещество напоминало тяжёлый радиоактивный материал.

      При нормальных условиях Кельвий оставался относительно стабильным.

      В глубоком вакууме при очень низкой температуре начинался быстрый распад с интенсивным выделением энергии.

      Это свойство позволяло регулировать реакцию через температуру.

      Активное охлаждение ускоряло распад.

      Рост температуры, вызванный самой реакцией, снижал её интенсивность.

      Такой механизм сделал Кельвий удобным источником энергии для крупных установок.

      При отказе охлаждения мощность реактора быстро снижалась.

      Попадание газа в реакторную камеру также подавляло активный распад.

      Главную опасность представляло разрушение защиты и последующее радиационное загрязнение.

      Разработку первых реакторов поручили Rolls-Royce.

      Опыт компании в создании авиационных двигателей и энергетических установок позволял быстро проектировать сложные системы охлаждения.

      English Electric отвечала за силовую электронику и управление нагрузкой.

      ---

      ### 1978 — Первая Космическая Станция

      Исследование Кельвия на Земле требовало очень сложных условий.

      Поэтому основные испытания перенесли на орбиту.

      В 1978 году на **Первой Космической Станции**, получившей сокращение ПКС, был запущен первый устойчивый экспериментальный кельвиевый реактор.

      Установка получила заводское обозначение **Rolls-Royce K.1**.

      Испытания подтвердили возможность длительного контролируемого получения энергии.

      Кельвий обеспечивал мощность, которая раньше требовала значительно более крупных установок.

      Это событие принято считать началом **Кельвиевой эпохи**.

      В последующие годы реакторы появились на орбитальных объектах.

      Позднее их начали строить и на Земле.

      Высокая стоимость ограничивала распространение технологии.

      Кельвиевые комплексы прежде всего обеспечивали энергией крупные города и промышленные районы.

      Rolls-Royce постепенно стала почти общим названием для тяжёлой корабельной энергетики.

      Конкурирующие системы существовали, но Имперский флот долгое время предпочитал реакторы серии K.

      Главной проблемой оставался сам Кельвий.

      Природные месторождения были крайне редкими.

      Попытки синтеза долгое время заканчивались без результата.

      ---

      ### 1989 — Лунная экзофаза

      Рост спроса на экзофазы ускорил освоение Луны.

      К этому времени Short Brothers выпускала большую часть тяжёлых транспортных аппаратов, связывавших поверхность Луны с орбитальной инфраструктурой.

      Cammell Laird строила крупные герметичные комплексы и промышленные модули.

      В 1989 году геологическая группа обнаружила необычное вещество в районе кратера Кеплер.

      Экзофаза получила название **Кеплерит**.

      Первые образцы хранились в вакуумных контейнерах и считались достаточно стабильными для исследования.

      Ситуация изменилась после доставки одного из образцов в герметичную лабораторию.

      Контакт Кеплерита с кислородсодержащей атмосферой вызвал резкий переход вещества в нестабильное состояние.

      Высвободившаяся энергия уничтожила лабораторию и повредила значительную часть комплекса.

      На месте аварии образовался небольшой кратер.

      После этого для работы с Кеплеритом ввели отдельный набор требований безопасности.

      Контакт с кислородом стал главным риском при его добыче и транспортировке.

      ---

      ### 1993 — Кельвиевый синтез

      Через четыре года исследовательская группа обнаружила практическое применение Кеплерита.

      При облучении очищенного вещества галлионным потоком определённой энергии часть его структуры переходила в состояние Кельвия.

      Процесс требовал очень точного контроля.

      Выход готового Кельвия оставался низким.

      Однако промышленное производство стало возможным.

      Для синтеза требовались Кеплерит и Галлеит.

      Сам процесс также потреблял большое количество энергии.

      Rolls-Royce получила контракт на проектирование промышленных синтезаторных комплексов.

      Ferranti разработала системы управления процессом и обработки измерений.

      Основным источником Галлеита оставалась Земля.

      Кеплерит добывался на Луне.

      Их совместное использование позволяло производить Кельвий в промышленных масштабах.

      После этого постоянное присутствие человека в космосе получило экономическую основу.

      ---

      ### 1995–2015 — Начало Солнечной экспансии

      Развитие кельвиевой энергетики позволило увеличить размеры космических кораблей и станций.

      На орбите появились постоянные верфи.

      Cammell Laird стала одним из крупнейших производителей тяжёлых гражданских кораблей.

      Компания строила танкеры и промышленные буксиры. Её орбитальные доки обслуживали конструкции, которые было невозможно собирать на поверхности планеты.

      Vickers-Armstrongs заняла основную нишу военного кораблестроения.

      Её верфи выпускали бронированные корпуса и корабельное вооружение.

      Short Brothers специализировалась на аппаратах, которым требовалась регулярная работа в атмосфере.

      De Havilland развивала лёгкие скоростные суда.

      Napier производила маневровые установки и аварийные двигательные системы.

      Marconi стала стандартным поставщиком корабельной связи и сенсорных комплексов.

      Ferranti выпускала навигационные вычислители и оборудование для Считателей.

      Большинство крупных кораблей представляло собой совместный продукт нескольких компаний.

      Корпус мог быть построен Cammell Laird, а реактор изготовлен Rolls-Royce. Электрическое оборудование при этом поставляла English Electric.

      Такая схема стала стандартом Имперской космической промышленности.

      Лунные поселения постепенно превратились в промышленные центры.

      Экспедиции достигли Марса и пояса астероидов.

      Корабли получили достаточно энергии для длительных полётов и работы тяжёлого оборудования.

      При этом межпланетные путешествия по-прежнему занимали значительное время.

      Главным ограничением оставалось расстояние между объектами Солнечной системы.

      ---

      ### Марсианский исход

      Часть государств за пределами британской системы рассматривала космическую экспансию как возможность получить политическую независимость.

      Несколько правительств и торговых объединений создали закрытый консорциум.

      Через промышленный шпионаж они получили проекты космических кораблей и данные о производстве Кельвия.

      Часть оборудования для работы с Галлеитом также попала в их распоряжение.

      Некоторые узлы были копиями британских систем. Другие строились по похищенным промышленным чертежам.

      После подготовки крупная колониальная экспедиция отправилась к Марсу.

      На тот момент Империя располагала ограниченными возможностями для ведения межпланетной войны.

      Лондон также считал долгосрочное существование независимой колонии маловероятным.

      Причиной был Галлеит.

      Его активная кристаллическая структура постепенно деградировала при длительном хранении вне среды, близкой к земной.

      Специальные контейнеры увеличивали срок хранения, однако не обеспечивали постоянную стабильность.

      Все известные крупные месторождения находились на Земле.

      Имперские специалисты рассчитали срок, после которого марсианские запасы должны были стать непригодными для основных технологий.

      Правительство ожидало капитуляции колонии или её постепенного технологического упадка.

      Марсианская промышленность продолжила работу.

      Спустя десять лет колония сохраняла производство сложного оборудования.

      Позднее там началось строительство новых кораблей.

      Способ, которым колонисты решили проблему Галлеита, стал одним из важнейших марсианских государственных секретов.

      ---

      ### 2015–2040 — Солнечный век

      Успех Марса заставил Империю ускорить собственную космическую программу.

      Началась постоянная колонизация Солнечной системы.

      Луна сохранила статус старейшего крупного промышленного центра за пределами Земли.

      Пояс астероидов стал важным источником сырья.

      На спутниках газовых гигантов появились исследовательские станции и добывающие предприятия.

      Марс закрепился в качестве главного независимого центра космической политики.

      Рост космической экономики усилил старые промышленные дома.

      Cammell Laird стала ассоциироваться с тяжёлыми грузовыми судами.

      De Havilland получила репутацию производителя дорогих скоростных кораблей.

      Bentley Engineering заняла небольшую, но престижную нишу компактных силовых систем. Её оборудование часто использовалось на дипломатических катерах и дорогих гражданских судах.

      Военные корабли Империи обычно строились вокруг корпусов Vickers-Armstrongs и реакторов Rolls-Royce.

      Их сенсорные системы в большинстве случаев поставляла Marconi.

      При этом скорость межпланетных перелётов продолжала ограничивать торговлю и управление.

      Даже корабль с мощным кельвиевым реактором должен был физически преодолеть расстояние между планетами.

      ---

      ### 2041 — Юпитерианский инцидент

      В 2041 году на удалённой Имперской станции в системе Юпитера одновременно проводились два независимых эксперимента.

      Первым руководила группа доктора Вейна.

      Исследователи работали над увеличением радиуса полевого экрана.

      Для этого они снизили плотность галлионного поля и расширили область его действия.

      Получившаяся установка охватывала большой объём, однако обеспечивала слишком слабую защиту для практического применения.

      Разработка получила название **поле Вейна**.

      Второй проект возглавляла доктор Эшдаун.

      Её группа испытывала экспериментальный кельвиевый реактор.

      Энергетическое ядро установки было построено Rolls-Royce.

      English Electric разработала систему, которая позволяла снимать мощность короткими управляемыми импульсами.

      Инженеры меняли частоту пульсации и измеряли эффективность разных режимов.

      Во время одного из испытаний импульсы реактора вошли в резонанс с активным полем Вейна.

      Станция исчезла из области наблюдения.

      Автоматические системы зарегистрировали резкое изменение локальных параметров пространства.

      Обломков на прежней орбите обнаружено не было.

      ---

      ### Обнаружение станции

      Через некоторое время автоматический аппарат дальней разведки **IDS-17 «Фарадей»** зарегистрировал искусственный радиосигнал в области, где не находилось известных станций.

      Первичная телеметрия указывала на оборудование пропавшего комплекса.

      «Фарадей» передал несколько пакетов данных, после чего связь с аппаратом прекратилась.

      Последующие наблюдения подтвердили, что пропавшая станция находилась в районе последней зарегистрированной позиции зонда.

      Станция сохранила большую часть оборудования и персонала.

      Позднее этот эффект получил название **переход Вейна—Эшдаун**.

      Исследования показали, что установка переносила ограниченную область пространства вместе с её содержимым.

      Корабль или станция при этом не проходили обычный путь между исходной областью и местом выхода.

      ---

      ### 2041–2048 — Исследование Перехода

      В течение следующих лет Империя провела серию закрытых экспериментов.

      Работы координировались ISIB и Адмиралтейством.

      Для контролируемого перехода требовались две разные системы.

      Первая создавала устойчивую пространственную конфигурацию, основанную на принципах поля Вейна.

      Эта установка получила название **метрический якорь**.

      Основную часть первых стационарных якорей строили Vickers-Armstrongs и English Electric.

      Вторая система формировала последовательность энергетических импульсов по принципу реактора Эшдаун.

      Её начали называть **переходным реактором**.

      Rolls-Royce отвечала за энергетическое ядро.

      English Electric производила импульсные регуляторы и силовую часть установки.

      Расчёт перехода оказался одной из самых сложных вычислительных задач своего времени.

      Ferranti разработала специализированные навигационные комплексы для работы со Считателями.

      Marconi создала датчики, способные точно определять гравитационную обстановку перед переходом.

      Исследования также показали опасность размещения полноценного якоря рядом с работающим переходным реактором.

      В определённых режимах между ними возникал резонанс, подобный тому, который вызвал Юпитерианский инцидент.

      Поэтому якоря стали строить как отдельные стационарные объекты.

      Корабли оснащались переходными реакторами и вспомогательными полевыми системами.

      ---

      ### Переходная оболочка

      При подготовке к прыжку переходный реактор формировал вокруг корабля замкнутую область.

      Она получила название **переходная оболочка**.

      В переход вместе с кораблём попадало всё, что полностью находилось внутри этой области.

      Наиболее стабильной была компактная форма оболочки.

      Её можно было вытягивать вдоль корпуса или расширять для захвата дополнительного груза.

      Каждое такое изменение увеличивало расход энергии.

      Из-за этого конструкция корабля напрямую влияла на его переходные характеристики.

      De Havilland одной из первых начала проектировать корпуса непосредственно под форму переходной оболочки.

      Так появились длинные лёгкие курьерские суда с очень высокой дальностью относительно собственной массы.

      Тяжёлое направление развивалось иначе.

      Cammell Laird создавала переходные буксиры и грузовые суда, рассчитанные на перевозку внешних контейнеров.

      Груз можно было закреплять за пределами основного корпуса, если поле охватывало его целиком.

      Позднее этот принцип стал стандартным для промышленного транспорта.

      ---

      ### Порядки перехода

      Дальность перехода зависела от режима работы реактора.

      Для увеличения дистанции требовалась более сложная и более быстрая последовательность импульсов.

      Устойчивые режимы получили название **порядков перехода**.

      Каждый следующий порядок требовал резкого роста энергетической мощности.

      Поэтому два корабля с одинаковыми реакторами могли иметь совершенно разную дальность.

      Лёгкий курьер тратил большую часть мощности на переход небольшой оболочки.

      Крупный транспорт расходовал значительную часть энергии на собственную массу и груз.

      Со временем переходный порядок стал одной из основных характеристик корабля.

      Это породило новое разделение рынка.

      De Havilland стала известна дальними курьерами.

      Cammell Laird доминировала в тяжёлых перевозках.

      Vickers-Armstrongs разрабатывала военные корабли, где дальность приходилось сочетать с бронёй и вооружением.

      Bentley Engineering выпускала небольшие дорогие переходные установки для специальных судов.

      ---

      ### Гравитационное ограничение

      Высокая гравитация нарушала стабильность переходной оболочки.

      Поэтому якоря приходилось размещать на значительном расстоянии от планет.

      Для переходов высокого порядка требовалась ещё более слабая гравитационная среда.

      Так вокруг крупных планет возникли несколько уровней переходной инфраструктуры.

      Ближние станции обслуживали местные маршруты.

      Более удалённые якоря использовались для дальних переходов.

      Путь от планеты до переходной станции корабль проходил обычным способом.

      Эти участки стали важной частью транспортной системы и зоной работы Имперского флота.

      Строительство крупных переходных станций стало отдельной отраслью.

      Cammell Laird отвечала за основные конструкции.

      English Electric поставляла энергетическую инфраструктуру.

      ---

      ### 2048–2060 — Эра Перехода

      После появления надёжных якорей транспортная система Солнечной системы резко изменилась.

      Межпланетные маршруты стали состоять из обычного полёта до якоря и последующего перехода.

      Для многих направлений длительность пути сократилась с месяцев до дней.

      При этом радиосвязь продолжала распространяться со скоростью света.

      Корабль мог доставить сообщение раньше, чем радиосигнал достигал той же точки.

      Из этого возникла новая система связи.

      Важные данные начали перевозить на физических носителях.

      Для этого строились быстрые курьерские корабли.

      Большинство ранних почтовых и дипломатических курьеров выпускала de Havilland.

      Особенно дорогие государственные аппараты иногда комплектовались оборудованием Bentley Engineering.

      Военные приказы и дипломатическая корреспонденция также перевозились между системами якорей.

      Транспорт стал быстрее обычной связи.

      ---

      ### Абсолютная система перехода

      Исследование эффекта Вейна—Эшдаун выявило ещё одно важное свойство экзофаз.

      Переход зависел от структуры пространства, которая имела собственную систему покоя.

      Обычная релятивистская физика продолжала работать для материи и света.

      Переходные процессы подчинялись дополнительному набору правил.

      Физики назвали связанную с ними систему **абсолютной системой отсчёта перехода**.

      Она определяла допустимую последовательность событий при использовании перехода.

      В рамках этой системы переход всегда связывал более раннее событие с более поздним.

      На основании экспериментальных данных перемещение в прошлое считалось физически невозможным.

      ---

      ### 2061 — Проект «Икар»

      После двух десятилетий эксплуатации переходной технологии Империя ведёт подготовку первого межзвёздного перехода.

      Теория допускает прыжок к другой звезде.

      Главным ограничением остаётся требуемая мощность.

      Для проекта возведена специальная инфраструктура на дальней границе Солнечной системы.

      Там находится самый удалённый метрический якорь своего времени.

      Государственная программа носит название **Проект ICARUS**.

      Проект находится под совместным управлением Адмиралтейства и ISIB.

      Почти каждая крупная компания стратегического сектора закреплена за собственной частью контракта.

      Rolls-Royce разрабатывает переходные реакторы.

      English Electric отвечает за импульсные системы и распределение энергии.

      Ferranti создаёт вычислительный комплекс экспедиции и оборудование для Считателей.

      Marconi поставляет системы связи и дальние сенсоры.

      Vickers-Armstrongs отвечает за вооружение военного корабля и его защитные системы.

      Перед экспедицией поставлены две основные задачи.

      Первая состоит в выполнении свободного межзвёздного перехода.

      Вторая заключается в строительстве нового метрического якоря возле звезды назначения.

      Для этого подготовлены два корабля.

      Первый представляет собой тяжёлый экспедиционный транспорт, построенный на верфях Cammell Laird.

      Он перевозит колониальный персонал и оборудование для строительства якоря.

      Значительную часть грузового объёма занимают промышленные системы и запасы материалов.

      Вторым кораблём служит военный эскорт.

      Его корпус построен Vickers-Armstrongs с учётом требований к переходу высокого порядка.

      Корабль значительно меньше транспорта и имеет очень мощный для своей массы реактор.

      После завершения строительства нового якоря военный корабль должен выполнить обратный переход.

      Его экипажу поручено доставить в Солнечную систему подтверждение успешного запуска межзвёздного маршрута.

      За дальней станцией отсутствует готовая переходная инфраструктура.

      Экспедиция должна выполнить свободный переход по расчётной гравитационной траектории звезды назначения.

      Успех проекта открывает возможность постоянного освоения других звёздных систем.

      В 2061 году оба корабля прибыли к внешнему якорю.

      После завершения подготовки начинается первый межзвёздный переход человечества.
