    body: |
      ## III. ПРОЕКТ ICARUS — СОСТОЯНИЕ НА 2061 ГОД

      **Задача:** совершить первый свободный межзвёздный переход в LHS 1140 и основать постоянную опорную точку для последующих экспедиций.

      Экспедиция состоит из двух судов.

      **Тяжёлый экспедиционный транспорт [название не закреплено]** доставляет колониальный персонал, промышленные запасы, оборудование жизнеобеспечения и комплект для развёртывания метрического якоря.

      **HMS *Peregrine*** — малый военный эскорт и курьер с экспериментальной переходной установкой. Он обеспечивает сопровождение и безопасность экспедиции. После подтверждения успешного развёртывания якоря обязан выполнить обратный переход в Солнечную систему и доставить Адмиралтейству отчёт.

      **Командир HMS *Peregrine*:** лейтенант Виктория Перси, временно исполняющая обязанности лейтенант-коммандера. Другие должности экипажа: пилот-штурман, главный инженер, артиллерийский офицер, офицер связи и вычислений. На борту также находится Считатель и корабельный компаньон Earl Grey.

      **Исход операции по состоянию на момент старта:** неизвестен.
