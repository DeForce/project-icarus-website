      ## 10. HMS Peregrine

      ### Общая конструкция

      HMS _Peregrine_ представляет собой малый военный корабль длиной около 60 метров.

      Корабль является серийным военным судном, переоборудованным для участия в Project ICARUS.

      В ходе переоборудования на корабле установлена экспериментальная переходная система.

      Основная конструкция корпуса и значительная часть штатного оборудования сохранены.

      Это позволило использовать уже существующее судно, однако ограничивает возможности изменения внутренней компоновки.

      #### Двигательная установка

      Главный маршевый двигатель располагается в корме по продольной оси корабля.

      Используется один центральный кельвиево-плазменный двигатель с возможностью изменения режима тяги.

      Дополнительно установлены вспомогательные двигатели и распределённая система маневровых сопел.

      Переходная установка Вейна—Эшдаун конструктивно отделена от обычной двигательной системы.

      Повреждение переходного двигателя само по себе не лишает корабль способности двигаться в обычном пространстве.

      ### Радиаторные паруса

      Характерной внешней особенностью _Peregrine_ являются две высокие радиаторные конструкции.

      Они выполнены в форме секционных мачт с протяжёнными излучающими поверхностями.

      Внутри панелей теплоноситель циркулирует по змеевидным трубопроводам.

      Радиаторные системы имеют раздельные контуры.

      Конструкция предусматривает складывание мачт.

      Секционное устройство позволяет отключать отдельные повреждённые участки.

      В штатном положении радиаторы обеспечивают охлаждение энергетического оборудования.

      При применении боевых режимов двигатель дополнительно использует ограниченные возможности тепловых буферов.

      Таким образом, радиаторные паруса являются важной частью как технического устройства, так и внешнего облика корабля.

      ### Характеристики

      |Параметр|Значение|
      |---|---|
      |Длина|Около 60 м|
      |Масса без рабочего тела|Около 400 т|
      |Главные маршевые двигатели|1|
      |Рабочее тело|Литий|
      |Запас лития|Около 40 т|
      |Экономичный режим|0,001–0,01 g|
      |Маневровый режим|До 0,1 g|
      |Боевой режим|До 0,8 g|
      |Кратковременный форсаж|До 2 g|
      |Экономичный удельный импульс|Порядка 20 000 с|
      |Характеристическая скорость при этом режиме|Около 19 км/с|
      |Радиаторные конструкции|2 секционные складные мачты|
      |Переходная установка|Экспериментальная, отдельная от маршевой|

      Приведённые показатели ускорения и удельного импульса являются расчётными характеристиками кельвиево-плазменной установки корабля.

      Полная инженерная спецификация корабля включает мощность реактора и характеристики тепловых буферов.

      ### Дальность и автономность

      Плановый срок независимого существования корабля составляет 90 суток.

      Дополнительно предусматривается аварийный запас, рассчитанный приблизительно на 30 суток.

      Корабль располагает системами регенерации воды и очистки атмосферы.

      Хранящиеся продовольственные и медицинские запасы рассчитаны на экипаж из пяти офицеров, корабельного компаньона и функционирование системы жизнеобеспечения Считателя.

      Масса запасов жизнеобеспечения и технических расходных материалов составляет несколько тонн.

      Отдельно учитываются рабочее тело двигателей и запасы экзофазных материалов.

      Продолжительность автономного существования корабля не равнозначна продолжительности непрерывной работы маршевого двигателя.
