articles:
  - key: example-networks
    category: example-technologies
    title: Информационные сети
    body: |
      ## Бортовой архив

      Корабельные терминалы подключены к центральному вычислительному комплексу.
      Справочные документы хранятся на местных носителях.

      Радиосвязь ограничена скоростью света. Записанные сведения также
      доставляются курьерскими кораблями.
    relatedArticles:
      - example-navigation
  - key: example-navigation
    category: example-technologies
    title: Навигационный пост
    body: |
      Для навигации применяются специализированные векторные дисплеи.
      Подробные расчёты доступны через текстовые терминалы.

systems:
